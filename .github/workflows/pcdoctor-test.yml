# 🖥️ PC Doctor (04-Nov-2026): tests the PC Doctor Agent on a real Windows PC (GitHub's Windows runner, Windows PowerShell 5.1)
# whenever pcdoctor/ changes: every script parses, lab-version.json SHA-256 list matches, every read-only check runs, the Safe-Mode
# service compiles, a pendrive report (.dlh) can be made. Nothing is sent to DB5.
name: PC Doctor test (Windows)
on:
  push:
    branches: [main]
    paths: ['pcdoctor/**', '.github/workflows/pcdoctor-test.yml']
  workflow_dispatch:
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults: { run: { shell: powershell } }
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script (PowerShell 5.1)
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem pcdoctor\src\*.ps1) { $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            if ($e.Count) { $bad++; $e | ForEach-Object { Write-Host "::error file=$($f.Name),line=$($_.Extent.StartLineNumber)::$($_.Message)" } } else { Write-Host "OK $($f.Name)" }
            $b = [IO.File]::ReadAllBytes($f.FullName); if (!($b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) { $bad++; Write-Host "::error file=$($f.Name)::no UTF-8 BOM (run tools/pcdoctor_version.py)" } }
          $PSVersionTable.PSVersion.ToString(); if ($bad) { exit 1 }
      - name: SHA-256 list matches the files
        run: |
          $v = Get-Content pcdoctor\lab-version.json -Raw | ConvertFrom-Json; $bad = 0
          foreach ($p in $v.files.PSObject.Properties) { $h = (Get-FileHash -Algorithm SHA256 "pcdoctor\src\$($p.Name)").Hash.ToLower(); if ($h -ne $p.Value) { $bad++; Write-Host "::error::$($p.Name) SHA differs - run tools/pcdoctor_version.py" } }
          "agent $($v.agent.ver) build $($v.agent.build)"; if ($bad) { exit 1 }
      - name: Run every read-only check (agent -Mode test)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File pcdoctor\src\agent.ps1 -Mode test; if (Test-Path "$env:ProgramData\DavanPCDoctor\id.json") { Write-Host "::error::test mode registered with DB5"; exit 1 }
          if (!(Test-Path "$env:TEMP\pd_test.json")) { exit 1 }
          $r = Get-Content "$env:TEMP\pd_test.json" -Raw | ConvertFrom-Json
          "startup: $($r.startup.sec) s | net gw $($r.net.gwMs) ms dns $($r.net.dnsMs) ms | printers spooler $($r.prn.spooler) | sfc bad $($r.sfc.bad) | bsod $($r.bsod.n7) | android clean ≈ $($r.plan) GB"
          "drivers $(@($r.inv.drivers).Count), startup items $(@($r.inv.startup).Count), cpu $($r.inv.cpu.n), ram $($r.inv.ramGB) GB, win $($r.inv.win.build)"
          if ($r.verdictTest -notmatch 'Disk failing') { Write-Host "::error::verdict engine did not find 'Disk failing'"; exit 1 }
      - name: Fingerprint + events + pendrive report (.dlh)
        run: |
          . .\pcdoctor\src\common.ps1; . .\pcdoctor\src\checks.ps1; . .\pcdoctor\src\fixes.ps1; . .\pcdoctor\src\dlh.ps1; $PD.Test = $true   # never touch DB5 from the runner
          $fp = PD-Fingerprint; "fingerprint: bu=$([bool]$fp.bu) bb=$([bool]$fp.bb) mac=$([bool]$fp.mac) disks=$(@($fp.disks).Count)"
          $e = @(PD-ReadEvents (Get-Date).AddDays(-3) 3); "events (3 days): $($e.Count) " + (($e | Group-Object k | ForEach-Object { $_.Name + '=' + $_.Count }) -join ' ')
          "deep freeze: $((PD-DeepFreeze).state) | sample: $((PD-Sample).cpu)% cpu"
          $f = PD-MakeDlh "$env:TEMP\usb\DavanLab"; Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($f); "dlh: $([IO.Path]::GetFileName($f)) $([math]::Round((Get-Item $f).Length/1KB)) KB, files: " + (($z.Entries | ForEach-Object FullName | Select-Object -First 12) -join ', '); $z.Dispose()
          $plan = PD-AndroidPlan; "android plan: $($plan.items.Count) items"; exit 0
      - name: Safe-Mode service compiles
        run: |
          $s = Get-Content pcdoctor\src\install.ps1 -Raw; $cs = [regex]::Match($s, "(?s)\`$cs = @'\r?\n(.*?)\r?\n'@").Groups[1].Value
          if (!$cs) { Write-Host "::error::service source not found"; exit 1 }
          Add-Type -TypeDefinition $cs -ReferencedAssemblies System.ServiceProcess -OutputAssembly "$env:TEMP\PCDoctorSvc.exe" -OutputType ConsoleApplication
          "service exe: $((Get-Item "$env:TEMP\PCDoctorSvc.exe").Length) bytes"
      - name: Sensor reader experiment (PawnIO driver + LibreHardwareMonitor newest; user OK 05-Nov-2026) - facts before building it into PC Doctor
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'; $d = "$env:RUNNER_TEMP\sens"; New-Item -ItemType Directory -Force $d | Out-Null
          $h = @{ 'User-Agent' = 'DavanPCDoctor' }
          $pr = Invoke-RestMethod -Headers $h 'https://api.github.com/repos/namazso/PawnIO.Setup/releases/latest'; "PawnIO release: $($pr.tag_name) assets: $(($pr.assets | ForEach-Object name) -join ', ')"
          $pa = $pr.assets | Where-Object { $_.name -match '\.exe$' } | Select-Object -First 1
          Invoke-WebRequest -UseBasicParsing -Headers $h $pa.browser_download_url -OutFile "$d\pawnio.exe"; $sg = Get-AuthenticodeSignature "$d\pawnio.exe"; "pawnio.exe $((Get-Item "$d\pawnio.exe").Length) bytes, signature $($sg.Status) by $($sg.SignerCertificate.Subject)"
          foreach ($a0 in @('-install -silent', '/S', '-silent -install')) {
            $p = Start-Process "$d\pawnio.exe" -ArgumentList $a0 -PassThru -WindowStyle Hidden; if (!$p.WaitForExit(90000)) { "install with '$a0': still running after 90 s (waits for a click?) - stopped"; $p.Kill(); continue }
            $v = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\PawnIO' -ErrorAction SilentlyContinue).DisplayVersion
            "install with '$a0': exit $($p.ExitCode), installed version: $v"; if ($v) { break } }
          $lr = Invoke-RestMethod -Headers $h 'https://api.github.com/repos/LibreHardwareMonitor/LibreHardwareMonitor/releases/latest'; "LHM release: $($lr.tag_name) assets: $(($lr.assets | ForEach-Object name) -join ', ')"
          $la = $lr.assets | Where-Object { $_.name -match '\.zip$' -and $_.name -notmatch 'NET\.\d' } | Select-Object -First 1   # the .NET Framework edition (Windows PowerShell 5.1 cannot load the .NET 10 one)
          Invoke-WebRequest -UseBasicParsing -Headers $h $la.browser_download_url -OutFile "$d\lhm.zip"; Expand-Archive "$d\lhm.zip" "$d\lhm" -Force
          $dll = Get-ChildItem "$d\lhm" -Recurse -Filter LibreHardwareMonitorLib.dll | Select-Object -First 1; "LHM dll: $($dll.FullName.Replace($d,'')) $($dll.VersionInfo.FileVersion) | files: $((Get-ChildItem $dll.DirectoryName -Filter *.dll | ForEach-Object Name) -join ', ')"
          try { Add-Type -Path $dll.FullName; $c = New-Object LibreHardwareMonitor.Hardware.Computer; $c.IsCpuEnabled = $true; $c.IsMotherboardEnabled = $true; $c.Open()
            "PawnIO per LHM: $([LibreHardwareMonitor.PawnIo.PawnIo]::IsInstalled) $([LibreHardwareMonitor.PawnIo.PawnIo]::Version)"; foreach ($x in $c.Hardware) { $x.Update(); "hw $($x.HardwareType) $($x.Name): " + ((@($x.Sensors) | Where-Object { [string]$_.SensorType -in 'Temperature','Fan','Voltage','Load' } | Select-Object -First 8 | ForEach-Object { "$($_.SensorType) $($_.Name)=$($_.Value)" }) -join ' | ') }
            $c.Close() } catch { "LHM load error: $($_.Exception.Message) | $($_.Exception.InnerException.Message) | $(($_.Exception.LoaderExceptions | Select-Object -First 2 | ForEach-Object Message) -join ' ; ')" }
          try { $t = @(Get-MpThreatDetection -ErrorAction Stop); "Defender detections: $($t.Count) $(($t | ForEach-Object { $_.Resources -join ';' }) -join ' || ')" } catch { "Defender: n/a" }
          Get-Service | Where-Object { $_.Name -match 'Pawn|R0' } | ForEach-Object { "service $($_.Name) $($_.Status)" }
      - name: Tray screenshots (every tab + the Show-me-this-PC pop-up)
        continue-on-error: true
        run: |
          # sample data in a private folder (nothing real, nothing sent anywhere); the pictures are only a downloadable file of this test run (kept 7 days)
          $r = "$env:RUNNER_TEMP\pdt"; New-Item -ItemType Directory -Force "$r\state", "$r\req", "$r\bin" | Out-Null; Copy-Item pcdoctor\src\notes.txt "$r\bin\notes.txt"
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          function J($n, $o) { $o | ConvertTo-Json -Depth 8 | Set-Content "$r\state\$n" -Encoding UTF8 }
          J 'now.json' @{ t = $now; cpu = 34; ram = 81; busy = 6; lat = 2; cfree = 14; cfreeGB = 28; temp = 47; df = 'frozen'; thawQ = 1; online = $true; q = 0; user = 'USER'; ver = '1.49'; name = 'DESKTOP-H25PRDD'
                           rtop = @(@{ n = 'firefox'; m = 3400; k = 31 }, @{ n = 'Memory Compression'; m = 933 }, @{ n = 'powershell'; m = 275; k = 3 }); top = @(@{ n = 'chrome'; c = 1.4; m = 39 }) }
          J 'verdict.json' @{ lv = 'orange'; v = 'Disk almost full'; why = 'C: has 28 GB free (14%). Clean now frees about 4.6 GB.'; conf = 90; all = @(@{ lv = 'orange'; v = 'Disk almost full' }, @{ lv = 'yellow'; v = 'Too little RAM' }, @{ lv = 'red'; v = 'Disk failing' }) }
          J 'pc.json' @{ name = 'B1'; grp = 'B'; place = 'Lab 2'; notes = '' }
          J 'running.json' @{ ver = '1.49'; build = 49; at = $now }
          J 'labver.json' @{ agent = @{ ver = '1.49'; build = 49; ist = '05 Nov 2026, 3:30 PM IST' }; news = @(@{ build = 49; ist = '05 Nov 2026, 3:30 PM IST'; text = 'Sample entry one' }, @{ build = 48; ist = '05 Nov 2026, 3:00 PM IST'; text = 'Sample entry two' }) }
          J 'upd.json' @{ at = $now; res = 'Already the newest: 1.49 (build 49)'; manual = $false }
          J 'inv.json' @{ battery = $null; disks = @(@{ model = 'HS-SSD-E100 256G'; health = 'Healthy' }) }
          J 'cfg.json' @{ groups = @{ B = @{ name = 'Lab 2' }; SA = @{ name = 'Super Admin' } } }
          J 'grid.json' @{ t = $now; now = @{ h1 = @{ name = 'B1'; lv = 'orange'; v = 'Disk almost full'; t = $now }; h2 = @{ name = 'B2'; lv = 'green'; v = 'Healthy'; t = $now }; h3 = @{ name = 'B3'; lv = 'red'; v = 'Disk failing'; t = $now } }
                           pcs = @{ h1 = @{ name = 'B1'; grp = 'B' }; h2 = @{ name = 'B2'; grp = 'B' }; h3 = @{ name = 'B3'; grp = 'B' } }; sum = $null; fix = $null }
          $env:PDT_ROOT = $r; $env:PDT_OUT = "$env:RUNNER_TEMP\shots"
          $p = Start-Process powershell -ArgumentList '-NoProfile -STA -ExecutionPolicy Bypass -File pcdoctor\src\tray.ps1 -selftest' -PassThru -Wait -NoNewWindow
          Get-ChildItem $env:PDT_OUT | ForEach-Object { "$($_.Name) $($_.Length) bytes" }
          # the pictures also go into THIS run's log as text (PNGBEGIN name ... PNGEND), so Claude can read them from the log - the artifact host is not reachable from Claude's session. Nothing is stored anywhere else.
          Get-ChildItem $env:PDT_OUT -Filter *.png | ForEach-Object { 'PNGBEGIN ' + $_.Name; [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName)); 'PNGEND' }
          Get-ChildItem $env:PDT_OUT -Filter error-*.txt | ForEach-Object { 'ERRFILE ' + $_.Name; Get-Content $_.FullName -Raw }
      - name: Upload the tray pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tray-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7
          if-no-files-found: ignore
