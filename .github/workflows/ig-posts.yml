# Instagram job, run HERE (public repo = free Actions minutes) - the code stays in the PRIVATE davan-scraper and is checked out at run time.
# user, 26-Nov-2026: the 2,000 free minutes/month were used up; this job ran ~400 min/month. Same job as davan-scraper ig-posts.yml
# (tools/ig_posts.py + tools/league_all.py + tools/sa_notify.py). Started by the Cloudflare worker (hourly timer + the staff app's "Run now").
# Secrets (this repo): IG_TOKEN, SA_DB1, SA_DB2, SA_DB4, SCRAPER_PAT (fine-grained token, read-only "Contents" on davan-scraper).
# LOGS ARE PUBLIC in a public repo: the scripts print only counts and status - never print names, marks or tokens here.
name: Instagram posts (free)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ig-posts
  cancel-in-progress: false
jobs:
  ig:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: harshgujjar/davan-scraper
          token: ${{ secrets.SCRAPER_PAT }}
          path: scraper
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install firebase-admin
      - working-directory: scraper
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SA_DB1: ${{ secrets.SA_DB1 }}
          SA_DB2: ${{ secrets.SA_DB2 }}
          SA_DB4: ${{ secrets.SA_DB4 }}
        run: python tools/ig_posts.py

      - name: 🏆 College league summary (never fails the Instagram job)
        if: always()
        continue-on-error: true
        working-directory: scraper
        env:
          SA_DB4: ${{ secrets.SA_DB4 }}
        run: python tools/league_all.py

      - name: Tell the Super Admin (☁️ Cloud alerts - Instagram news / FAILED)
        if: always()
        working-directory: scraper
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 tools/sa_notify.py "Instagram posts" ig
