# Every 3 hours: recompute the 200-unit forecast for the meter app + Meter Tracker widget (same file cap-core.js as the app).
# Result goes to DB1 harsha_home_bills/electric/capAlert. Nothing to do by hand; if it fails 3 reads in a row GitHub mails the failure.
name: Meter cap alert (3-hourly)
on:
  schedule:
    - cron: '11 */3 * * *'
  workflow_dispatch:
jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/cap-job.js
