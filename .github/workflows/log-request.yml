# 07-Oct-2026 (user: "a refresh only for the widget to upload its log immediately when asked"): the staff app / student portal
# "📥 Get log" button calls the Cloudflare worker davan-release (?log=<code>), which starts this job. It writes log-req.json
# {CODE: time} on main; the student widget (w185+) reads that file every 15 minutes in its update check (GitHub, no Firebase
# cost) and uploads its log at once. Entries older than 2 days are dropped.
name: Widget log request
on:
  workflow_dispatch:
    inputs:
      code:
        description: 'widget code (e.g. EMTH7Q or S-7UP47U)'
        required: true
permissions:
  contents: write
concurrency: log-request
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add the request to log-req.json
        env:
          CODE: ${{ github.event.inputs.code }}
        run: |
          python3 - <<'PY'
          import json, os, re, time
          c = os.environ['CODE'].strip().upper()
          if not re.fullmatch(r'[A-Z0-9-]{4,12}', c): raise SystemExit('not a widget code: ' + c)
          p = 'log-req.json'; d = json.load(open(p)) if os.path.exists(p) else {}
          now = int(time.time() * 1000); d = {k: v for k, v in d.items() if now - int(v) < 2 * 864e5}; d[c] = now
          open(p, 'w').write(json.dumps(d, indent=1, sort_keys=True) + '\n')
          PY
          git config user.name "davan-release-bot"
          git config user.email "davan-release-bot@users.noreply.github.com"
          git add log-req.json
          git commit -q -m "Widget log request: $CODE"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 3)); done; exit 1
