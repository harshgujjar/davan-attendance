# Read-only student widget check (05-Oct-2026): the coding sessions cannot reach Firebase, GitHub's runner can.
# Prints COUNTS only (no names / URNs - Actions logs of this repo are public). Run by hand: Actions -> Widget check -> Run workflow.
name: Widget check (read-only)
on:
  schedule:
    - cron: '35 2 * * *'   # v1853: 8:05 am IST daily - a problem (blocked widgets, release stopped) becomes a Super Admin alert
  workflow_dispatch:
    inputs:
      since:
        description: 'Block window start (ISO time, UTC)'
        required: false
        default: '2026-10-05T17:09:00Z'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count widgets
        env:
          SINCE: ${{ github.event.inputs.since }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          KEY = 'AIzaSyBnWSfjilDwri7dBpONF2GwgXDJnc1W--w'
          URL = 'https://davan-student-portal-default-rtdb.asia-southeast1.firebasedatabase.app'
          req = urllib.request.Request('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + KEY, data=b'{"returnSecureToken":true}', headers={'Content-Type': 'application/json'})
          tok = json.load(urllib.request.urlopen(req))['idToken']
          get = lambda p: json.load(urllib.request.urlopen(URL + '/' + p + '.json?auth=' + tok)) or {}
          ms = lambda t: int(datetime.datetime.fromisoformat(t.replace('Z', '+00:00')).timestamp() * 1000)
          ist = lambda x: (datetime.datetime.utcfromtimestamp(x / 1000) + datetime.timedelta(hours=5, minutes=30)).strftime('%d-%b %I:%M %p IST') if x else '-'
          L = get('davan_pub/student_widget_latest')
          M = get('davan_pub/student_widget_manual_version'); print('student_widget_manual_version:', M.get('apkVersion'), '| set', M.get('setAt'))
          C = get('davan_pub/release_ctl'); print('release_ctl (stop switch):', {k: C.get(k) for k in ('stopDate', 'stopAll', 'nowReq', 'at')})
          print('student_widget_latest: apkVersion', L.get('apkVersion'), '| minApkVersion', L.get('minApkVersion'), '| written', ist(L.get('at') or 0), 'by', L.get('raisedBy', '?'))
          A = get('davan_pub/student_widget_active'); R = get('davan_pub/student_widget_report')
          since = ms(os.environ.get('SINCE') or '2026-10-05T17:09:00Z'); fix = int(L.get('at') or 0) if int(L.get('minApkVersion') or 0) <= 108 else 0
          # v1914: the floor is raised ON PURPOSE (STU_WIDGET_BLOCK_V in the staff app, 133 from v1814) - the old 108 test was a false alarm
          import re; FLOOR = int(re.search(r'const STU_WIDGET_BLOCK_V = (\d+)', open('src/index.src.html', encoding='utf-8').read()).group(1)); MIN = int(L.get('minApkVersion') or 0)
          linked = [c for c in A if not c.upper().startswith('S-') and isinstance(A[c], dict) and A[c].get('urn') and not A[c].get('hostelOnly')]
          vers = {}; risk = 0; still = 0; cleared = 0; old = 0
          for c in linked:
              r = R.get(c) or {}; v = int(r.get('apkVersion') or 0); t = max(int(r.get('ts') or 0), int(r.get('workerLastRunAt') or 0))
              vers[v] = vers.get(v, 0) + 1
              if v and v < 108: old += 1
              if 108 <= v < 176 and t >= since:
                  risk += 1
                  if fix and t >= fix: cleared += 1
                  else: still += 1
          print('linked student widgets:', len(linked))
          print('by version:', ', '.join('w%d: %d' % (k, vers[k]) for k in sorted(vers, reverse=True)))
          print('older than w108 (always blocked):', old)
          print('w108-w175 that refreshed since', ist(since), '(could have read the 176 block):', risk)
          print('  of these, refreshed again after the fix (unblocked):', cleared)
          print('  still showing "update needed" until their next refresh:', still if fix else str(still) + ' (minApkVersion is not back to 108 yet!)')
          S = get('davan_pub/staff_widget_report'); now = datetime.datetime.utcnow().timestamp() * 1000
          st = [x for x in S.values() if isinstance(x, dict) and x.get('linked') is not False and x.get('name')]
          best = {}
          for x in st:   # one per person: the phone seen last
              k = str(x.get('name')).strip().lower()
              if k not in best or int(x.get('at') or 0) > int(best[k].get('at') or 0): best[k] = x
          sv = {}
          for x in best.values(): v = int(x.get('v') or 0); sv[v] = sv.get(v, 0) + 1
          act = [x for x in best.values() if now - int(x.get('at') or 0) < 3 * 864e5]
          av = {}
          for x in act: v = int(x.get('v') or 0); av[v] = av.get(v, 0) + 1
          print('STAFF widgets (one per person, linked):', len(best), '| by version:', ', '.join('w%d: %d' % (k, sv[k]) for k in sorted(sv, reverse=True)))
          print('STAFF seen in the last 3 days:', len(act), '| by version:', ', '.join('w%d: %d' % (k, av[k]) for k in sorted(av, reverse=True)))
          # v1853: problems -> the Super Admin's ☁️ alert (tools/sa_notify.py); a hand run always reports
          probs = []
          print('floor wanted (STU_WIDGET_BLOCK_V):', FLOOR, '| DB2 minApkVersion:', MIN)
          if MIN > FLOOR: probs.append('minApkVersion is %d, above the floor %d - %d widgets (w%d-w%d) are blocked' % (MIN, FLOOR, sum(n for k, n in vers.items() if FLOOR <= k < MIN), FLOOR, MIN - 1))
          if C.get('stopAll'): probs.append('widget releases are STOPPED until you press Resume')
          hand = os.environ.get('GITHUB_EVENT_NAME') != 'schedule'
          if probs or hand:
              sa = {'title': ('⚠ Widget check: ' + str(len(probs)) + ' problem' + ('s' if len(probs) > 1 else '')) if probs else '✅ Widget check: all fine',
                    'body': '\n'.join(probs) + ('\n' if probs else '') + 'Student widgets %d · staff %d (seen in 3 days %d)' % (len(linked), len(best), len(act)),
                    'color': 'amber' if probs else 'green', 'kind': 'check',
                    'link': 'https://harshgujjar.github.io/davan-attendance/index.html?go=widget-version'}   # v1914: tap opens 📲 Widget Version, not the GitHub run
              open(os.path.join(os.environ.get('RUNNER_TEMP', '.'), 'sa.json'), 'w').write(json.dumps(sa, ensure_ascii=False))
          PY
      - name: Tell the Super Admin (☁️ Cloud alerts)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 tools/sa_notify.py "Widget check" check
