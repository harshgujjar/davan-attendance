# 07-Oct-2026 (user: "how to make a deploy tool"): Claude cannot reach Cloudflare from its session, so GitHub deploys the worker.
# Runs when tools/cloudflare-release-worker.js (or its settings) changes on main, or by hand (Actions -> Deploy Cloudflare worker).
# Needs ONE repository secret: CLOUDFLARE_API_TOKEN (Cloudflare -> My Profile -> API Tokens -> "Edit Cloudflare Workers" template,
# only this account). Optional: CLOUDFLARE_ACCOUNT_ID if the key can see more than one account. Steps: RELEASE-WORKER.md.
name: Deploy Cloudflare worker
on:
  push:
    branches: [main]
    paths:
      - 'tools/cloudflare-release-worker.js'
      - 'tools/cloudflare/davan-release.wrangler.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy-worker
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare key is set
        id: key
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "::warning::CLOUDFLARE_API_TOKEN is not set yet - nothing deployed (see RELEASE-WORKER.md)"; echo "ok=" >> $GITHUB_OUTPUT; else echo "ok=1" >> $GITHUB_OUTPUT; fi
      - name: Deploy davan-release
        if: steps.key.outputs.ok == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 12-Oct-2026: a key pasted on a phone can carry a space or line break (Cloudflare then answers 9106) - strip them
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]' | sed 's/^Bearer//')"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')" || unset CLOUDFLARE_ACCOUNT_ID
          echo "key length: ${#CLOUDFLARE_API_TOKEN} characters (a Cloudflare API token is 40)"
          cd tools/cloudflare
          npx --yes wrangler@3 deploy --config davan-release.wrangler.toml
      - name: Check the live worker
        if: steps.key.outputs.ok == '1'
        run: |
          sleep 5; curl -sS https://davan-release.harshgujjar.workers.dev/ | tee /dev/stderr | grep -q '"ver":6' && echo "✅ worker v6 is live (4 timers)"
