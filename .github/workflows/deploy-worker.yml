# 07-Oct-2026 (user: "how to make a deploy tool"): Claude cannot reach Cloudflare from its session, so GitHub deploys the worker.
# Runs when tools/cloudflare-release-worker.js (or its settings) changes on main, or by hand (Actions -> Deploy Cloudflare worker).
# Needs ONE repository secret: CLOUDFLARE_API_TOKEN (Cloudflare -> My Profile -> API Tokens -> "Edit Cloudflare Workers" template,
# only this account). Optional: CLOUDFLARE_ACCOUNT_ID if the key can see more than one account. Steps: RELEASE-WORKER.md.
name: Deploy Cloudflare worker
on:
  push:
    branches: [main]
    paths:
      - 'tools/cloudflare-release-worker.js'
      - 'tools/cloudflare/davan-release.wrangler.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy-worker
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare key is set
        id: key
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "::warning::CLOUDFLARE_API_TOKEN is not set yet - nothing deployed (see RELEASE-WORKER.md)"; echo "ok=" >> $GITHUB_OUTPUT; else echo "ok=1" >> $GITHUB_OUTPUT; fi
      - name: Deploy davan-release
        if: steps.key.outputs.ok == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 12-Oct-2026: a key pasted on a phone can carry a space or line break (Cloudflare then answers 9106) - strip them
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]' | sed 's/^Bearer//')"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')" || unset CLOUDFLARE_ACCOUNT_ID
          echo "key length: ${#CLOUDFLARE_API_TOKEN} characters"
          # an ACCOUNT API token (Cloudflare 2026) cannot call /memberships, which wrangler uses to find the account - look the account
          # up with the key itself and hand it to wrangler (the account id is not a secret)
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            CLOUDFLARE_ACCOUNT_ID="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | python3 -c 'import sys,json; r=json.load(sys.stdin); print((r.get("result") or [{}])[0].get("id","") if r.get("success") else ""); sys.stderr.write("" if r.get("success") else "accounts: "+json.dumps(r.get("errors"))+"\n")')"
            export CLOUDFLARE_ACCOUNT_ID
          fi
          echo "account id found: ${CLOUDFLARE_ACCOUNT_ID:+yes}"
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | python3 -c 'import sys,json; r=json.load(sys.stdin); print("key check:", "ok" if r.get("success") else r.get("errors"))' || true
          cd tools/cloudflare
          npx --yes wrangler@4 deploy --config davan-release.wrangler.toml
      - name: Check the live worker
        if: steps.key.outputs.ok == '1'
        run: |
          sleep 5; curl -sS https://davan-release.harshgujjar.workers.dev/ | tee /dev/stderr | grep -q '"ver":14' && echo "✅ worker v14 is live (timers, Super Admin alerts, AI)"
