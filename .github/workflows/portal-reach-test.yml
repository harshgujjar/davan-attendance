# 08-Oct-2026 (user: "can app.py run in the cloud"): does www.davandvg.com answer GitHub's (USA) machines?
# No password is used: it opens the home page and sends a login with a dummy name. "-1" = the portal answered (wrong login, as expected).
name: Portal reach test (no password)
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Home page
        run: curl -sS -m 30 -o /dev/null -w "home http %{http_code} in %{time_total}s from $(curl -s -m 10 https://ipinfo.io/country)\n" http://www.davandvg.com/ || echo "home page NOT reachable"
      - name: Login endpoint (dummy name)
        run: |
          r=$(curl -sS -m 30 -X POST http://www.davandvg.com/rediCore.php -d "reqst=login&ty=a&u=reach-test&p=reach-test" || echo "NOT reachable")
          echo "rediCore answered: '$r'  (-1 = portal works from here, the dummy login is refused as expected)"
