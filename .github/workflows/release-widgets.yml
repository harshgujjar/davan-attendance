# Daily widget release (user, 05-Oct-2026): new widget builds go first to the "next" files (the Super Admin's phone, the codes in
# davan-widget-next.json and the spoken-alerts test list update from them at once); every evening at 9:30 pm IST this job makes the
# newest "next" build the public one, so all other staff and students get ONE update a day. Run it by hand (Actions -> Run workflow)
# for an urgent fix.
name: Release widgets (9 - 10 pm IST)
on:
  schedule:
    - cron: '30 15 * * *'  # 15:30 UTC = 9:00 pm IST (user, 06-Oct: one window, 9 - 10 pm)
    - cron: '45 15 * * *'  # backups - GitHub starts scheduled runs late or not at all; a run with nothing new does nothing
    - cron: '5 16 * * *'
    - cron: '20 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: release-widgets
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make the newest "next" builds public
        id: rel
        run: |
          python3 - <<'PY'
          import json, os, shutil, datetime
          # 06-Oct-2026: GitHub started a backup run 5 hours late (3:51 am IST) and released early - a SCHEDULED run releases
          # only between 9:00 and 10:00 pm IST (user); a hand run (workflow_dispatch) any time
          ist = datetime.datetime.utcnow() + datetime.timedelta(hours=5, minutes=30)
          if os.environ.get('GITHUB_EVENT_NAME') == 'schedule' and ist.hour != 21:
              print('scheduled run outside 9 - 10 pm IST (' + ist.strftime('%H:%M') + '): nothing released')
              open(os.environ['GITHUB_OUTPUT'], 'a').write('changed=\nmsg=\n'); raise SystemExit(0)
          RAW = 'https://raw.githubusercontent.com/harshgujjar/davan-attendance/main/'
          out = []
          def bump(pub, apk, v):
              p = json.load(open(pub)); p['apkVersion'] = v; p['apkUrl'] = RAW + apk + '?v=%d' % v
              open(pub, 'w').write(json.dumps(p, indent=2, ensure_ascii=False) + '\n')
          for nxt, pub, apk_next, apk_pub, test in [
              ('student-widget-next.json', 'student-widget-version.json', 'Davan.Student-next.apk', 'Davan.Student.apk', ('student-widget-test.json', 'Davan.Student-test.apk')),
              ('davan-widget-next.json', 'davan-widget-version.json', 'DavanWidget-next.apk', 'DavanWidget.apk', None)]:
              if not (os.path.exists(nxt) and os.path.exists(apk_next)): continue
              n = json.load(open(nxt)).get('apkVersion', 0); p = json.load(open(pub)).get('apkVersion', 0)
              if n <= p: continue
              shutil.copyfile(apk_next, apk_pub); bump(pub, apk_pub, n); out.append('%s w%d' % (apk_pub, n))
              if test:
                  t = json.load(open(test[0])).get('apkVersion', 0)
                  if n > t: shutil.copyfile(apk_next, test[1]); bump(test[0], test[1], n)
          print('released:', out or 'nothing new')
          open(os.environ['GITHUB_OUTPUT'], 'a').write('changed=%s\nmsg=%s\n' % ('1' if out else '', ', '.join(out)))
          PY
      - name: Commit and push
        if: steps.rel.outputs.changed == '1'
        run: |
          git config user.name "davan-release-bot"
          git config user.email "davan-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "Daily 9 pm widget release: ${{ steps.rel.outputs.msg }}"
          git push origin HEAD:main
      - name: Rebuild GitHub Pages (the widgets read the version files there)
        if: steps.rel.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
