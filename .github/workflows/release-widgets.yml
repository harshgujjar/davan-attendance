# Nightly widget release (user, 06-Oct-2026): new widget builds go first to the "next" files (the Super Admin, the codes in the next
# jsons, the spoken-alerts test list and 3-tap phones update from them at once). EVERY night between 9 and 10 pm IST this job makes the
# newest "next" build the public one by itself (from 9 pm; if GitHub starts the run late, until 6 am - once a night) - nobody has to ask - so all other staff and students get ONE update a day.
# The Super Admin controls it from the staff app (Global Switches -> Widget updates), stored in DB2 davan_pub/release_ctl:
#   stopDate = 'YYYY-MM-DD' (IST)  -> no release that night ("Stop tonight")
#   stopAll  = true                -> no release until Resume ("Stop until resume")
#   nowReq   = ms time             -> release at the next run of this job, any hour ("Release now"; handled once, see release-state.json)
# Display numbers: each release raises the public json's "display" by ONE (225 -> 226), whatever the build number was, and keeps
# names[build] = display. Testers see display.N for the builds after it (226.1, 226.2 ...), everyone else whole numbers.
# A hand run (Actions -> Release widgets -> Run workflow) releases at once, stop switch or not.
name: Release widgets (nightly 9 pm IST)
on:
  schedule:
    - cron: '7,37 * * * *'  # every half hour: "Release now" from the staff app; from 9 pm to 6 am IST the nightly release (once)
    - cron: '30 15 * * *'   # 9:00 pm IST - GitHub starts scheduled runs late or not at all; a run with nothing new does nothing
    - cron: '50 15 * * *'
    - cron: '15 16 * * *'
    - cron: '45 16 * * *'
    - cron: '20 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: release-widgets
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make the newest "next" builds public
        id: rel
        run: |
          python3 - <<'PY'
          import json, os, shutil, datetime, urllib.request, time
          OUT = os.environ['GITHUB_OUTPUT']
          def done(changed, msg): open(OUT, 'a').write('changed=%s\nmsg=%s\n' % (changed, msg)); raise SystemExit(0)
          ist = datetime.datetime.utcnow() + datetime.timedelta(hours=5, minutes=30); today = ist.strftime('%Y-%m-%d')
          ev = os.environ.get('GITHUB_EVENT_NAME')
          ST = 'release-state.json'
          state = json.load(open(ST)) if os.path.exists(ST) else {}
          # the Super Admin's switch (DB2 davan_pub/release_ctl, anonymous sign-in like the apps)
          ctl = None
          for i in range(3):
              try:
                  KEY = 'AIzaSyBnWSfjilDwri7dBpONF2GwgXDJnc1W--w'
                  URL = 'https://davan-student-portal-default-rtdb.asia-southeast1.firebasedatabase.app'
                  req = urllib.request.Request('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + KEY, data=b'{"returnSecureToken":true}', headers={'Content-Type': 'application/json'})
                  tok = json.load(urllib.request.urlopen(req, timeout=20))['idToken']
                  ctl = json.load(urllib.request.urlopen(URL + '/davan_pub/release_ctl.json?auth=' + tok, timeout=20)) or {}
                  break
              except Exception as e:
                  print('switch read failed:', e); time.sleep(5)
          now_req = int((ctl or {}).get('nowReq') or 0); now_new = now_req > int(state.get('nowDone') or 0)
          why = ''
          if ev == 'workflow_dispatch': why = 'hand run'
          elif now_new: why = 'Release now (staff app)'
          elif ist.hour >= 21 or ist.hour < 6:
              # 06-Oct-2026: GitHub started the timed runs hours late (or not at all), so the nightly release counts from 9 pm until
              # 6 am - ONCE per night (release-state.json "night" = the evening's date); the stop switch is for that evening
              night = today if ist.hour >= 21 else (ist - datetime.timedelta(days=1)).strftime('%Y-%m-%d')
              if state.get('night') == night: print('already released tonight (' + night + ')'); done('', '')
              if ctl is None: print('could not read the stop switch - not releasing in this run (the next run tries again)'); done('', '')
              if ctl.get('stopAll'): print('stopped until resume (staff app switch)'); done('', '')
              if ctl.get('stopDate') == night: print('stopped for tonight (staff app switch)'); done('', '')
              why = 'nightly 9 pm'; state['night'] = night
          else:
              print('nothing to do at ' + ist.strftime('%H:%M') + ' IST'); done('', '')
          RAW = 'https://raw.githubusercontent.com/harshgujjar/davan-attendance/main/'
          out = []
          def save(f, p): open(f, 'w').write(json.dumps(p, indent=2, ensure_ascii=False) + '\n')
          def bump(f, apk, v, release=False):
              p = json.load(open(f)); old = int(p.get('apkVersion') or 0)
              if release:
                  d = int(p.get('display') or old); names = p.get('names') or {}
                  names.setdefault(str(old), d); d += 1; names[str(v)] = d
                  p['display'] = d; p['names'] = names; p['releasedAt'] = ist.strftime('%d-%b-%Y %H:%M IST')
              p['apkVersion'] = v; p['apkUrl'] = RAW + apk + '?v=%d' % v; save(f, p); return p.get('display')
          for nxt, pub, apk_next, apk_pub, test in [
              ('student-widget-next.json', 'student-widget-version.json', 'Davan.Student-next.apk', 'Davan.Student.apk', ('student-widget-test.json', 'Davan.Student-test.apk')),
              ('davan-widget-next.json', 'davan-widget-version.json', 'DavanWidget-next.apk', 'DavanWidget.apk', None)]:
              if not (os.path.exists(nxt) and os.path.exists(apk_next)): continue
              n = json.load(open(nxt)).get('apkVersion', 0); p = json.load(open(pub)).get('apkVersion', 0)
              if n <= p: continue
              shutil.copyfile(apk_next, apk_pub); d = bump(pub, apk_pub, n, True); out.append('%s w%d as %s' % (apk_pub, n, d))
              if test:
                  t = json.load(open(test[0])).get('apkVersion', 0)
                  if n > t: shutil.copyfile(apk_next, test[1]); bump(test[0], test[1], n)
          print('released (' + why + '):', out or 'nothing new')
          if now_new: state['nowDone'] = now_req
          if out: state['last'] = {'at': ist.strftime('%d-%b-%Y %H:%M IST'), 'why': why, 'what': out}
          save(ST, state)
          done('1' if (out or now_new or why == 'nightly 9 pm') else '', (why + ': ' + ', '.join(out or ['nothing new'])))
          PY
      - name: Commit and push
        if: steps.rel.outputs.changed == '1'
        run: |
          git config user.name "davan-release-bot"
          git config user.email "davan-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "Widget release - ${{ steps.rel.outputs.msg }}"
          git push origin HEAD:main
      - name: Rebuild GitHub Pages (the widgets read the version files there)
        if: steps.rel.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
