<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Davan Certificate Check</title>
<!-- v1 (19-Oct-2026, Placement BUILD-ALL step 5): the page the certificate's QR opens - learn/v.html#<learner id>.<track>.<level>.
     Reads that learner's DB4 learn/prog row (anonymous sign-in, the same as learn/placement.js) and says if the level is really cleared. -->
<style>
:root{--bg:#FDE8D4;--card:#FFFAF2;--ink:#1F1A15;--mu:#6B5F55;--ok:#1E7B3A;--no:#B3261E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1813;--card:#2a231c;--ink:#f6efe6;--mu:#c5b8aa;--ok:#5fd17f;--no:#ff8a80}}
:root[data-theme="dark"]{--bg:#1d1813;--card:#2a231c;--ink:#f6efe6;--mu:#c5b8aa;--ok:#5fd17f;--no:#ff8a80}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:24px 16px}
.k{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:20px;box-shadow:4px 4px 0 var(--ink);text-align:center}
.logo{font-weight:800;letter-spacing:1px}.big{font-size:44px;margin:6px 0}.mu{color:var(--mu);font-size:14px}
h1{font-family:Georgia,serif;font-size:24px;margin:8px 0}.nm{font-family:Georgia,serif;font-size:26px;margin:4px 0}
</style>
</head>
<body>
<main><div class="k" id="out"><div class="logo"><span style="color:#2B2A84">DA</span><span style="color:#D3262E">V</span><span style="color:#2B2A84">AN</span> · PLACEMENT</div><p class="mu">Checking the certificate…</p></div></main>
<script>
(async function () {
  const out = document.getElementById('out'), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const head = '<div class="logo"><span style="color:#2B2A84">DA</span><span style="color:#D3262E">V</span><span style="color:#2B2A84">AN</span> · PLACEMENT</div>';
  const show = h => { out.innerHTML = head + h; };
  const parts = decodeURIComponent(location.hash.slice(1)).split('.'), n = parseInt(parts.pop(), 10), tr = parts.pop(), id = parts.join('.');
  if (!id || !tr || !(n > 0)) return show('<h1>No certificate in this link</h1><p class="mu">Scan the QR code on a Davan Placement certificate.</p>');
  try {
    const bank = await (await fetch('bank.json?d=' + new Date().toISOString().slice(0, 10))).json(), db = bank.db;
    const a = await (await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + db.key, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{"returnSecureToken":true}' })).json();
    const r = await fetch(db.url + '/' + db.root + '/prog/' + encodeURIComponent(id) + '.json?auth=' + a.idToken); if (!r.ok) throw new Error('read ' + r.status);
    const p = await r.json(), t = (bank.tracks || []).find(x => x.id === tr), now = p && p.lv ? p.lv[tr] || 0 : 0;
    if (!p || !t) return show('<h1 style="color:var(--no)">❌ Not found</h1><p class="mu">There is no Davan Placement record for this certificate.</p>');
    const ok = now >= n, tier = n >= 10 ? '👑 GOLD · PRO' : n >= 5 ? '🥈 SILVER' : '🥉 BRONZE';
    show(`<h1 style="color:${ok ? 'var(--ok)' : 'var(--no)'}">${ok ? '✅ Genuine certificate' : '❌ Level not reached'}</h1><div class="mu">Issued to</div><div class="nm"><span>${esc(p.n)}</span></div><div class="mu">${esc(p.c || '')}</div>` +
      `<p>${tier} · <b>${esc(t.emoji + ' ' + t.name)}</b> · level ${n}</p><p class="mu">Level reached now: ${now} of 10${p.ld ? ' · last practised ' + esc(p.ld) : ''}</p><p class="mu">Davan College · checked ${new Date().toLocaleDateString('en-IN')}</p>`);
  } catch (e) { show('<h1>Could not check right now</h1><p class="mu">Check the internet and open the link again. (' + esc(e.message) + ')</p>'); }
})();
</script>
</body>
</html>
