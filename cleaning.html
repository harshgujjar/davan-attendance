<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F7FB">
<title>Hostel Cleaning · Davan &amp; Nutana</title>
<!--
  cleaning.html  v1.3 (27-Sep-2026) - skip the empty slot 0 Firebase adds when room IDs are plain numbers (was a '0' tile + blank floor chip)
  cleaning.html  v1.2 (27-Sep-2026) - one COMMON washroom tile per hostel (key {hid}~_common, washroom staff only); room label falls back to room ID when number is missing
  cleaning.html  v1.1 (27-Sep-2026) - fix: board now shows after a correct PIN ([hidden] rule); visible error line
  cleaning.html  v1.0 (27-Sep-2026)
  For hostel cleaning staff: 4-digit PIN -> board of rooms -> tap "Room cleaned" /
  "Washroom cleaned". Writes hostel/cleaning/{IST date}/{hid}~{roomId}:
     { room: {at, by, byId, via:'cleaner'}, wash: {at, by, byId, via:'cleaner'} }
  Students' widgets (w97) poll that one record every 30 min and notify:
  "Hi Harsha, your room A-101 cleaning is done at 12:00 noon today by ABCD."
  Staff list: hostel/cleaning_staff/{id}: {name, role:'room'|'wash'|'both', hostels:{boys,girls}, pinHash, active}
  pinHash = SHA-256(pin + ':' + id)  (managed in index.html > Hostel Settings).
  Database: davan-lessonplan-archive (hostel DB, "DB3"), anonymous auth over REST.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Kannada:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F7FB; --card:#FFFFFF; --ink:#16212E; --ink-2:#556274; --line:#D8E1EA;
    --soap:#1F6FD1; --soap-bg:#E3EEFB; --done:#138A4B; --done-bg:#DDF4E7; --tap:#0F5AB0; --warn:#B45309;
    --kn:'Noto Sans Kannada', sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}  /* v1.1: #login{display:flex} was overriding hidden -> board never appeared */
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Atkinson Hyperlegible','Noto Sans Kannada',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  .kn{font-family:var(--kn);font-size:.86em;color:var(--ink-2);display:block;line-height:1.35}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  button:focus-visible{outline:3px solid var(--soap);outline-offset:2px}
  /* login */
  #login{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
  .brand{font-size:15px;color:var(--ink-2);margin:0 0 6px}
  h1{font-size:30px;line-height:1.15;margin:0 0 4px}
  .dots{display:flex;gap:14px;justify-content:center;margin:26px 0}
  .dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);display:block}
  .dots i.on{background:var(--ink)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:340px;margin:0 auto}
  .pad button{height:70px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);font-size:28px;font-weight:700}
  .pad button:active{background:var(--soap-bg)}
  .msg{min-height:24px;text-align:center;margin-top:14px;font-weight:700}
  .msg.err{color:#B42318}
  /* board */
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
  .hello{font-size:22px;font-weight:700;margin:0}
  .date{color:var(--ink-2);margin:2px 0 0}
  .out{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:14px}
  .progress{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
  .progress b{font-size:34px;line-height:1}
  .bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:10px}
  .bar div{height:100%;background:var(--done);width:0;transition:width .4s}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
  .chip{white-space:nowrap;border:1.5px solid var(--line);background:var(--card);border-radius:22px;padding:9px 16px;font-size:15px;font-weight:700}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .room{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;text-align:left;min-height:124px;display:flex;flex-direction:column;justify-content:space-between}
  .room .no{font-size:34px;font-weight:700;letter-spacing:.5px}
  .room.all{background:var(--done-bg);border-color:var(--done)}
  .st{display:flex;flex-direction:column;gap:5px;font-size:14px}
  .st span{display:flex;align-items:center;gap:6px}
  .st .ok{color:var(--done);font-weight:700}
  .st .no-yet{color:var(--ink-2)}
  .ico{width:18px;height:18px;flex:none}
  .empty{background:var(--card);border:1.5px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--ink-2)}
  /* sheet */
  #sheet{position:fixed;inset:0;background:rgba(22,33,46,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
  #sheet.open{display:flex}
  .sh{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0))}
  .sh h2{font-size:30px;margin:0}
  .big{width:100%;border-radius:18px;padding:18px;margin-top:12px;font-size:21px;font-weight:700;display:flex;align-items:center;gap:12px;text-align:left}
  .big.room-b{background:var(--soap);color:#fff}
  .big.wash-b{background:#0E7490;color:#fff}
  .big.done{background:var(--done-bg);color:var(--done);border:2px solid var(--done)}
  .big small{display:block;font-weight:400;font-size:14px;opacity:.9}
  .undo{margin-top:10px;font-size:15px;color:var(--tap);text-decoration:underline}
  .close{width:100%;margin-top:14px;padding:14px;border-radius:14px;border:1.5px solid var(--line);font-size:17px}
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;display:none;z-index:9;max-width:92vw}
  @media (prefers-reduced-motion:reduce){.bar div{transition:none}}
</style>
</head>
<body>

<div id="login" class="wrap">
  <p class="brand">Davan &amp; Nutana hostel</p>
  <h1>Enter your PIN</h1>
  <span class="kn">ನಿಮ್ಮ ಪಿನ್ ನಮೂದಿಸಿ</span>
  <div class="dots" id="pin-dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
  <p class="msg" id="login-msg"></p>
</div>

<div id="board" class="wrap" hidden>
  <header>
    <div><p class="hello" id="hello"></p><p class="date" id="today"></p></div>
    <button class="out" onclick="logout()">Log out</button>
  </header>
  <div class="progress" aria-live="polite">
    <div><b id="done-n">0</b> <span id="done-of"></span></div>
    <div class="bar"><div id="bar"></div></div>
  </div>
  <div class="chips" id="hostel-chips"></div>
  <div class="chips" id="floor-chips"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" onclick="if(event.target===this)closeSheet()">
  <div class="sh" id="sh"></div>
</div>
<div id="toast" role="status"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-bed" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 18V7m0 7h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5M7 11.5a1.5 1.5 0 1 0 0-.01"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 3.5c3.5 4.2 6 7.4 6 10.5a6 6 0 0 1-12 0c0-3.1 2.5-6.3 6-10.5z"/></symbol>
</svg>

<script>
const DB = 'https://davan-lessonplan-archive-default-rtdb.asia-southeast1.firebasedatabase.app';
const KEY = 'AIzaSyDBfwaUiCP_5tLPgCV2yZSeeWRnwnvnkDQ';
const S = { staff: null, rooms: {}, clean: {}, hostels: {}, cfg: {}, hid: null, floor: 'all', pin: '', open: null };
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ist = () => new Date(Date.now() + 330 * 60000);
const today = () => ist().toISOString().slice(0, 10);
const tfmt = t => { const s = new Date(t).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' }); return s.replace(/^12:00\s*pm$/i, '12:00 noon'); };
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2600); }

// ── anonymous auth (REST) ──────────────────────────────────────────
let tok = null, tokExp = 0;
async function token() {
  if (tok && Date.now() < tokExp - 60000) return tok;
  let rt = null; try { rt = localStorage.getItem('cl_rt'); } catch (e) {}
  let r, j;
  if (rt) {
    r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + KEY, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(rt) });
    if (r.ok) { j = await r.json(); tok = j.id_token; tokExp = Date.now() + (+j.expires_in || 3600) * 1000; try { localStorage.setItem('cl_rt', j.refresh_token); } catch (e) {} return tok; }
  }
  r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + KEY, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{"returnSecureToken":true}' });
  if (!r.ok) throw new Error('Could not connect (' + r.status + ')');
  j = await r.json(); tok = j.idToken; tokExp = Date.now() + (+j.expiresIn || 3600) * 1000;
  try { localStorage.setItem('cl_rt', j.refresh_token || j.refreshToken); } catch (e) {}
  return tok;
}
async function dbGet(p) { const r = await fetch(DB + '/' + p + '.json?auth=' + await token()); if (!r.ok) throw new Error('Read failed (' + r.status + ')'); return r.json(); }
async function dbPatch(p, v) { const r = await fetch(DB + '/' + p + '.json?print=silent&auth=' + await token(), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(v) }); if (!r.ok && r.status !== 204) throw new Error('Save failed (' + r.status + ')'); }
async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }

// ── PIN login ──────────────────────────────────────────────────────
function buildPad() {
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '\u232B'];
  document.getElementById('pad').innerHTML = keys.map(k => k === '' ? '<span></span>' : `<button aria-label="${k === '\u232B' ? 'Delete' : k}" onclick="key('${k}')">${k}</button>`).join('');
}
function paintDots() { document.querySelectorAll('#pin-dots i').forEach((d, i) => d.classList.toggle('on', i < S.pin.length)); }
function key(k) {
  const m = document.getElementById('login-msg'); m.textContent = ''; m.className = 'msg';
  if (k === '\u232B') S.pin = S.pin.slice(0, -1); else if (S.pin.length < 4) S.pin += k;
  paintDots();
  if (S.pin.length === 4) tryLogin();
}
async function tryLogin() {
  const m = document.getElementById('login-msg');
  m.textContent = 'Checking\u2026';
  try {
    const staff = await dbGet('hostel/cleaning_staff') || {};
    let hit = null;
    for (const [id, st] of Object.entries(staff)) {
      if (st && st.active !== false && st.pinHash && st.pinHash === await sha(S.pin + ':' + id)) { hit = Object.assign({ id }, st); break; }
    }
    if (!hit) { m.textContent = 'Wrong PIN. Try again.'; m.className = 'msg err'; S.pin = ''; paintDots(); return; }
    S.staff = hit;
    try { localStorage.setItem('cl_staff', JSON.stringify({ id: hit.id, h: hit.pinHash, until: Date.now() + 14 * 3600000 })); } catch (e) {}
    S.pin = ''; paintDots(); m.textContent = '';
    showBoard();
  } catch (e) { m.textContent = e.message; m.className = 'msg err'; S.pin = ''; paintDots(); }
}
async function resume() {
  try {
    const s = JSON.parse(localStorage.getItem('cl_staff') || 'null');
    if (!s || Date.now() > s.until) return false;
    const st = await dbGet('hostel/cleaning_staff/' + s.id);
    if (!st || st.active === false || st.pinHash !== s.h) return false;   // PIN changed or removed -> log in again
    S.staff = Object.assign({ id: s.id }, st); return true;
  } catch (e) { return false; }
}
function logout() { try { localStorage.removeItem('cl_staff'); } catch (e) {} location.reload(); }

// ── board ──────────────────────────────────────────────────────────
function canRoom() { return S.staff.role === 'room' || S.staff.role === 'both'; }
function canWash() { return S.staff.role === 'wash' || S.staff.role === 'both'; }
function myHostels() { const h = S.staff.hostels || {}; return ['boys', 'girls'].filter(x => h[x]); }
async function showBoard() {
  document.getElementById('login').hidden = true; document.getElementById('board').hidden = false;
  document.getElementById('hello').textContent = 'Hi ' + S.staff.name;
  document.getElementById('today').innerHTML = ist().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
  await load();
  setInterval(() => { if (document.visibilityState === 'visible') load(true); }, 120000);
}
async function load(quiet) {
  try {
    const [rooms, clean, cfg] = await Promise.all([dbGet('hostel/rooms'), dbGet('hostel/cleaning/' + today()), dbGet('hostel/config/hostels')]);
    S.rooms = rooms || {}; S.clean = clean || {}; S.cfg = cfg || {};
    const mine = myHostels();
    if (!S.hid || !mine.includes(S.hid)) S.hid = mine[0] || null;
    render();
  } catch (e) { if (!quiet) toast(e.message); }
}
function roomList() {
  // v1.3: numeric room IDs (1,2,3) come back from Firebase as a list with an EMPTY slot 0 -> skip empty entries
  return Object.entries(S.rooms[S.hid] || {}).filter(([id, r]) => r && typeof r === 'object').map(([id, r]) => Object.assign({ id }, r))
    .sort((a, b) => (+a.floor || 0) - (+b.floor || 0) || String(a.block || '').localeCompare(String(b.block || '')) || String(a.number).localeCompare(String(b.number), undefined, { numeric: true }));
}
const label = r => r.id === '_common' ? 'Common washroom' : (r.number != null && r.number !== '' ? (r.block ? r.block + '-' : '') + r.number : r.id);
const rec = r => S.clean[S.hid + '~' + r.id] || {};
function isDone(r) { const c = rec(r); if (r.id === '_common') return !!c.wash; return (!canRoom() || !!c.room) && (!canWash() || !!c.wash); }
function render() {
  const mine = myHostels(), names = { boys: 'Boys hostel', girls: 'Girls hostel' };
  document.getElementById('hostel-chips').innerHTML = mine.length > 1 ? mine.map(h => `<button class="chip ${S.hid === h ? 'on' : ''}" onclick="S.hid='${h}';S.floor='all';render()">${esc((S.cfg[h] && S.cfg[h].name) || names[h])}</button>`).join('') : '';
  const all = roomList();
  const floors = [...new Set(all.map(r => String(r.floor == null ? '' : r.floor)))];
  document.getElementById('floor-chips').innerHTML = floors.length > 1 ? [`<button class="chip ${S.floor === 'all' ? 'on' : ''}" onclick="S.floor='all';render()">All floors</button>`]
    .concat(floors.map(f => `<button class="chip ${S.floor === f ? 'on' : ''}" onclick="S.floor='${esc(f)}';render()">Floor ${esc(f)}</button>`)).join('') : '';
  const list = all.filter(r => S.floor === 'all' || String(r.floor) === S.floor);
  // one common washroom per hostel, always first, only for washroom staff
  if (canWash() && S.floor === 'all') list.unshift({ id: '_common' });
  const done = list.filter(isDone).length;
  document.getElementById('done-n').textContent = done;
  document.getElementById('done-of').innerHTML = 'of ' + list.length + ' rooms done' + '<span class="kn">' + list.length + ' ಕೊಠಡಿಗಳಲ್ಲಿ ' + done + ' ಮುಗಿದಿದೆ</span>';
  document.getElementById('bar').style.width = (list.length ? done * 100 / list.length : 0) + '%';
  const grid = document.getElementById('grid');
  if (!S.hid) { grid.innerHTML = '<div class="empty">No hostel is assigned to you. Ask the warden.</div>'; return; }
  if (!list.length) { grid.innerHTML = '<div class="empty">No rooms added yet.</div>'; return; }
  grid.innerHTML = list.map(r => {
    const c = rec(r);
    const line = (ok, at, txt, icon) => `<span class="${ok ? 'ok' : 'no-yet'}"><svg class="ico"><use href="#${ok ? 'i-check' : icon}"/></svg>${ok ? txt + ' ' + esc(tfmt(at)) : txt}</span>`;
    return `<button class="room ${isDone(r) ? 'all' : ''}" onclick="openRoom('${esc(r.id)}')" aria-label="${esc(label(r))}">
      <span class="no" style="${r.id === '_common' ? 'font-size:22px;' : ''}">${r.id === '_common' ? '\u{1F6BF} ' : ''}${esc(label(r))}</span>
      <span class="st">${canRoom() && r.id !== '_common' ? line(c.room, c.room && c.room.at, 'Room', 'i-bed') : ''}${canWash() ? line(c.wash, c.wash && c.wash.at, r.id === '_common' ? 'Cleaned' : 'Washroom', 'i-drop') : ''}</span></button>`;
  }).join('');
}

// ── mark cleaned ───────────────────────────────────────────────────
function openRoom(id) {
  const r = Object.assign({ id }, (S.rooms[S.hid] || {})[id] || {}); S.open = r;
  const common = id === '_common';
  const c = rec(r);
  const btn = (kind, cls, icon, en, kn) => {
    const x = c[kind];
    if (x) {
      const mine = x.byId === S.staff.id && Date.now() - x.at < 10 * 60000;
      return `<div class="big done"><svg class="ico" style="width:28px;height:28px"><use href="#i-check"/></svg><span>${en} done at ${esc(tfmt(x.at))}<small>by ${esc(x.by || '')}</small></span></div>` +
        (mine ? `<button class="undo" onclick="mark('${kind}', false)">Undo (marked by mistake)</button>` : '');
    }
    return `<button class="big ${cls}" onclick="mark('${kind}', true)"><svg class="ico" style="width:30px;height:30px"><use href="#${icon}"/></svg><span>${en} cleaned<small class="kn" style="color:inherit">${kn}</small></span></button>`;
  };
  document.getElementById('sh').innerHTML = `<h2 id="sh-title">${common ? '' : 'Room '}${esc(label(r))}</h2>
    <p class="date">Tap after you finish cleaning.<span class="kn">ಸ್ವಚ್ಛಗೊಳಿಸಿದ ನಂತರ ಒತ್ತಿರಿ</span></p>
    ${canRoom() && !common ? btn('room', 'room-b', 'i-bed', 'Room', 'ಕೊಠಡಿ ಸ್ವಚ್ಛವಾಗಿದೆ') : ''}
    ${canWash() ? btn('wash', 'wash-b', 'i-drop', common ? 'Common washroom' : 'Washroom', common ? 'ಸಾಮಾನ್ಯ ಶೌಚಾಲಯ ಸ್ವಚ್ಛವಾಗಿದೆ' : 'ಶೌಚಾಲಯ ಸ್ವಚ್ಛವಾಗಿದೆ') : ''}
    <button class="close" onclick="closeSheet()">Close</button>`;
  document.getElementById('sheet').classList.add('open');
}
function closeSheet() { document.getElementById('sheet').classList.remove('open'); S.open = null; }
async function mark(kind, on) {
  const r = S.open; if (!r) return;
  const key = S.hid + '~' + r.id;
  const val = on ? { at: Date.now(), by: S.staff.name, byId: S.staff.id, via: 'cleaner' } : null;
  try {
    await dbPatch('hostel/cleaning/' + today() + '/' + key, { [kind]: val });
    S.clean[key] = Object.assign({}, S.clean[key] || {}, { [kind]: val || undefined });
    if (!on) delete S.clean[key][kind];
    toast(on ? (r.id === '_common' ? 'Common washroom' : (kind === 'room' ? 'Room ' : 'Washroom ') + label(r)) + ' marked clean' : 'Undone');
    render(); openRoom(r.id);
    if (on && isDone(r)) setTimeout(closeSheet, 700);
  } catch (e) { toast(e.message + ' \u2014 check internet and tap again'); }
}

// ── start ──────────────────────────────────────────────────────────
// v1.1: show any script error on screen (staff phones have no console)
window.addEventListener('error', e => { const m = document.getElementById('login-msg'); if (m) { m.textContent = 'Error: ' + e.message; m.className = 'msg err'; } });
window.addEventListener('unhandledrejection', e => { const m = document.getElementById('login-msg'); if (m) { m.textContent = 'Error: ' + ((e.reason && e.reason.message) || e.reason); m.className = 'msg err'; } });
buildPad();
document.addEventListener('keydown', e => { if (!document.getElementById('login').hidden && /^[0-9]$/.test(e.key)) key(e.key); if (!document.getElementById('login').hidden && e.key === 'Backspace') key('\u232B'); });
resume().then(ok => { if (ok) showBoard(); });
</script>
</body>
</html>
