<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Home Class admin</title>
<link rel="manifest" href="manifest-hcadmin.json"><meta name="theme-color" content="#22223b"><link rel="icon" href="icon-homeclass-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<!-- Home Class ADMIN (only the admin's phone): all families -> tap a family: children, devices, 🆘 reports (note, voice note, log), live, log.
     The family list is ENCRYPTED in DB3 homeclass/<C.REG>/ for the admin's key (C.register in homeclass-core.js); the private key is given once in the
     admin link (#d=...) and kept only in this phone's storage. v1 = 09-Nov-2026 (kids v77 / core v40 / parent v48). -->
<style>
:root{--bg:#f3f2ff;--card:#fff;--ink:#22223b;--mute:#6b6b85;--line:#e7e6f5;--brand:#5b4bff;--good:#16b46c;--bad:#ff7a45;--live:#ff4d6d;--gold:#ffb703;--shadow:0 6px 22px rgba(60,50,160,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
h1,h2,h3{font-family:'Baloo 2',Nunito,sans-serif;margin:0}h1{font-size:23px}h2{font-size:19px}h3{font-size:16px;margin-bottom:6px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{flex:1}.mute{color:var(--mute);font-size:13px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;background:rgba(91,75,255,.08);font:800 12px Nunito;margin:2px 3px 0 0}
.chip.r{background:rgba(255,77,109,.13);color:#c9184a}.chip.g{background:rgba(22,180,108,.13);color:#0d7a48}.chip.y{background:rgba(255,183,3,.2);color:#8a5a00}
.btn{border:0;border-radius:999px;padding:8px 14px;font:900 13px Nunito;background:var(--brand);color:#fff;cursor:pointer}.btn.soft{background:rgba(91,75,255,.1);color:var(--brand)}.btn.good{background:var(--good)}
.fam{cursor:pointer}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--good);margin-right:4px}.dot.off{background:#bbb}
.map{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}.map i{font-style:normal;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:800 10px Nunito;background:rgba(127,127,170,.13);color:var(--mute)}.map i.m{background:var(--good);color:#fff}.map i.c{background:var(--brand);color:#fff}
.tabs{display:flex;gap:5px;overflow-x:auto;margin:8px 0}.tabs button{flex:0 0 auto;border:0;padding:7px 11px;border-radius:12px;background:#fff;font:800 12px Nunito;color:var(--mute)}.tabs button.on{background:var(--ink);color:#fff}
pre{white-space:pre-wrap;font:12px/1.35 ui-monospace,monospace;background:#f6f5ff;border-radius:12px;padding:10px;max-height:360px;overflow:auto;margin:6px 0}
.rep{border-left:4px solid var(--live);padding-left:10px;margin:10px 0}.rep.done{border-color:var(--good);opacity:.75}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi div{background:#fff;border-radius:14px;padding:8px;text-align:center;box-shadow:var(--shadow)}.kpi b{display:block;font:800 21px 'Baloo 2'}.kpi span{font-size:11px;color:var(--mute)}
</style></head><body><div class="wrap" id="app"><div class="card">Loading…</div></div>
<script src="homeclass-core.js?v=40"></script>
<script>
(function () {
'use strict';
var C = window.HCcore, $ = function (id) { return document.getElementById(id); }, E = function (x) { return C.esc(x == null ? '' : String(x)); };
var A = { fams: [], cur: null, tab: 'rep', kidVer: 0 };
/* the private key: from the link once (#d=...), then only in this phone's storage */
var m = location.hash.match(/[#&]d=([A-Za-z0-9_-]{40,})/);
if (m) { try { localStorage.setItem('hcadm_d', m[1]); } catch (e) {} history.replaceState(null, '', location.pathname); }
var D = ''; try { D = localStorage.getItem('hcadm_d') || ''; } catch (e) {}
function get(path) { return fetch(C.DB + path + '.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }); }
function fget(f, p) { return get('homeclass/' + f + (p ? '/' + p : '')); }
function ago(t) { if (!t) return 'never'; var s = (Date.now() - t) / 1000; return s < 90 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' days ago'; }
function when(t) { return new Date(t).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' }); }
function copy(t, b) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { b.textContent = '✅ Copied'; }, function () { b.textContent = '⚠️ Copy failed'; }); }
function ub(b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
function decrypt(v) {
  var o = JSON.parse(v), sub = crypto.subtle, priv = { kty: 'EC', crv: 'P-256', x: C.ADMIN_PUB.x, y: C.ADMIN_PUB.y, d: D };
  return sub.importKey('jwk', priv, { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']).then(function (pk) {
    return sub.importKey('jwk', { kty: 'EC', crv: 'P-256', x: o.x, y: o.y }, { name: 'ECDH', namedCurve: 'P-256' }, false, []).then(function (ek) {
      return sub.deriveBits({ name: 'ECDH', public: ek }, pk, 256); }); })
    .then(function (bits) { return sub.digest('SHA-256', bits); })
    .then(function (k) { return sub.importKey('raw', k, 'AES-GCM', false, ['decrypt']); })
    .then(function (aes) { return sub.decrypt({ name: 'AES-GCM', iv: ub(o.i) }, aes, ub(o.c)); })
    .then(function (pt) { return JSON.parse(new TextDecoder().decode(pt)); });
}
function load() {
  if (!D) { $('app').innerHTML = '<div class="card"><h2>🔒 Home Class admin</h2><p class="mute">Open the admin link Claude gave you (it carries your private key). After that this phone remembers it.</p></div>'; return; }
  $('app').innerHTML = '<div class="card">⏳ Loading families…</div>';
  Promise.all([get('homeclass/' + C.REG), fetch('homeclass-ver.json?t=' + Date.now()).then(function (r) { return r.json(); }).catch(function () { return {}; })]).then(function (a) {
    A.kidVer = +(a[1] && a[1].kid) || 0;
    var reg = a[0] || {}, ids = Object.keys(reg);
    return Promise.all(ids.map(function (id) { return decrypt(reg[id]).catch(function () { return null; }); }));
  }).then(function (l) {
    var seen = {}; A.fams = l.filter(function (x) { if (!x || !x.f || seen[x.f]) return false; seen[x.f] = 1; return true; });
    return Promise.all(A.fams.map(function (f) {
      return Promise.all([fget(f.f, 'cfg'), fget(f.f, 'dev'), fget(f.f, 'reports') ]).then(function (r) {
        f.cfg = r[0] || {}; f.dev = r[1] || {}; f.reports = r[2] || {};
        f.open = Object.keys(f.reports).filter(function (k) { return (f.reports[k] || {}).st !== 'done'; }).length;
        f.last = Math.max.apply(null, [0].concat(Object.keys(f.dev).map(function (k) { return f.dev[k].at || 0; })));
        f.probs = probs(f);
      });
    }));
  }).then(drawList).catch(function (e) { $('app').innerHTML = '<div class="card">⚠️ ' + E(e.message) + ' <button class="btn soft" onclick="location.reload()">⟳ Try again</button></div>'; });
}
/* problems found by itself: open reports, old app screens, silent voice, devices gone quiet */
function probs(f) {
  var p = [];
  if (f.open) p.push('🆘 ' + f.open + ' open report' + (f.open > 1 ? 's' : ''));
  Object.keys(f.dev).forEach(function (k) { var d = f.dev[k];
    if (A.kidVer && d.kind !== 'parent' && +d.ver && A.kidVer - d.ver >= 3 && Date.now() - (d.at || 0) < 7 * 864e5) p.push('📱 ' + (d.name || k) + ' is ' + (A.kidVer - d.ver) + ' versions old (v' + d.ver + ')');
    if (d.voice && d.voice !== 'ok' && Date.now() - (d.at || 0) < 864e5) p.push('🔇 ' + (d.name || k) + ': voice ' + d.voice);
  });
  return p;
}
function famName(f) { return C.famName(f.cfg) || f.n || ('Family …' + f.f.slice(-4)); }
function drawList() {
  A.cur = null;
  var fams = A.fams.slice().sort(function (a, b) { return (b.probs.length > 0) - (a.probs.length > 0) || b.last - a.last; });
  var online = 0; fams.forEach(function (f) { Object.keys(f.dev).forEach(function (k) { if (Date.now() - (f.dev[k].at || 0) < 180000) online++; }); });
  var h = '<div class="row"><h1 class="sp">🛠️ Home Class admin</h1><button class="btn soft" id="rl">⟳</button></div>' +
    '<div class="mute">' + fams.length + ' famil' + (fams.length === 1 ? 'y' : 'ies') + ' · ' + online + ' device' + (online === 1 ? '' : 's') + ' online now</div>' +
    '<div class="kpi" style="margin-top:10px"><div><b>' + fams.length + '</b><span>families</span></div><div><b>' + fams.reduce(function (s, f) { return s + f.open; }, 0) + '</b><span>open 🆘</span></div><div><b>' + fams.reduce(function (s, f) { return s + C.kidList(f.cfg).length; }, 0) + '</b><span>children</span></div></div>';
  if (!fams.length) h += '<div class="card mute">No family has registered yet. A family appears here when its app opens (v77 or newer).</div>';
  fams.forEach(function (f, i) {
    var kids = C.kidList(f.cfg).map(function (k) { return E(k.name); }).join(' · ') || 'no children yet';
    h += '<div class="card fam" data-i="' + A.fams.indexOf(f) + '"><div class="row"><div class="sp"><h2>' + E(famName(f)) + '</h2><div class="mute">' + kids + ' · last seen ' + ago(f.last) + '</div></div>' +
      (f.probs.length ? '<span class="chip r">🔴 ' + f.probs.length + '</span>' : '<span class="chip g">✅</span>') + '</div><div style="margin-top:6px">' +
      Object.keys(f.dev).map(function (k) { var d = f.dev[k]; return '<span class="chip"><span class="dot' + (Date.now() - (d.at || 0) < 180000 ? '' : ' off') + '"></span>' + E(d.name || k) + ' · v' + E(d.ver || '?') + (d.app ? ' / ' + E(d.app) : '') + '</span>'; }).join('') +
      '</div>' + (f.probs.length ? '<div class="mute" style="margin-top:6px">' + f.probs.map(E).join('<br>') + '</div>' : '') + '</div>';
  });
  $('app').innerHTML = h;
  $('rl').onclick = load;
  Array.prototype.forEach.call(document.querySelectorAll('.fam'), function (el) { el.onclick = function () { openFam(A.fams[+el.getAttribute('data-i')]); }; });
}
function openFam(f) { A.cur = f; A.tab = f.open ? 'rep' : 'kids'; drawFam(); }
function drawFam() {
  var f = A.cur, T = [['rep', '🆘 Reports' + (f.open ? ' (' + f.open + ')' : '')], ['kids', '👦 Children'], ['dev', '📱 Devices'], ['live', '👀 Live'], ['log', '🧾 Log']];
  $('app').innerHTML = '<div class="row"><button class="btn soft" id="bk">←</button><div class="sp"><h1>' + E(famName(f)) + '</h1><div class="mute">' + (function (n) { return n + (n === 1 ? ' child' : ' children'); })(C.kidList(f.cfg).length) + ' · ' + Object.keys(f.dev).length + ' devices · key …' + E(f.f.slice(-4)) + '</div></div></div>' +
    '<div class="tabs">' + T.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (A.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div><div id="body"><div class="card">⏳</div></div>';
  $('bk').onclick = drawList;
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.onclick = function () { A.tab = b.getAttribute('data-t'); drawFam(); }; });
  ({ rep: tabRep, kids: tabKids, dev: tabDev, live: tabLive, log: tabLog })[A.tab](f);
}
function tabRep(f) {
  var ids = Object.keys(f.reports).sort().reverse();
  if (!ids.length) { $('body').innerHTML = '<div class="card mute">No reports from this family. 🎉</div>'; return; }
  $('body').innerHTML = ids.map(function (id) { var r = f.reports[id] || {};
    return '<div class="card rep' + (r.st === 'done' ? ' done' : '') + '"><div class="row"><b class="sp">' + (r.st === 'done' ? '✅ ' : '🆘 ') + when(r.at) + '</b><span class="chip">' + E(r.who || '') + ' · ' + E(r.devName || '') + '</span></div>' +
      (r.note ? '<div style="margin:6px 0;font-size:15px">' + E(r.note) + '</div>' : '') + (r.heard ? '<div class="mute">🎙️ heard: "' + E(r.heard) + '"</div>' : '') +
      (r.aud ? '<audio controls src="' + E(r.aud) + '" style="width:100%;margin-top:6px"></audio>' : '') + (r.recFrom ? '<div data-rec="' + id + '"><button class="btn soft" data-play="' + id + '">▶ Play voice note</button></div>' : '') +
      '<div class="mute" style="margin-top:6px">' + E(r.model || '') + ' · ' + E(r.ver || '') + ' · ' + E(r.app || '') + '</div>' +
      '<details><summary class="mute">🧾 Log at that time</summary><pre>' + E(r.log || '') + '</pre><button class="btn soft" data-copy="' + id + '">📋 Copy</button></details>' +
      '<div class="row" style="margin-top:8px">' + (r.st === 'done' ? '<button class="btn soft" data-st="' + id + '" data-v="open">↩ Re-open</button>' : '<button class="btn good" data-st="' + id + '" data-v="done">✅ Solved</button>') + '</div></div>';
  }).join('');
  $('body').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-copy')) return copy((f.reports[b.getAttribute('data-copy')] || {}).log || '', b);
    if (b.hasAttribute('data-st')) { var id = b.getAttribute('data-st'), v = b.getAttribute('data-v');
      fetch(C.DB + 'homeclass/' + f.f + '/reports/' + id + '/st.json', { method: 'PUT', body: JSON.stringify(v) }).then(function () { f.reports[id].st = v; f.open = Object.keys(f.reports).filter(function (k) { return f.reports[k].st !== 'done'; }).length; f.probs = probs(f); drawFam(); }); return; }
    if (b.hasAttribute('data-play')) { var r = f.reports[b.getAttribute('data-play')]; b.textContent = '⏳ Finding the recording…';
      fetch(C.DB + 'homeclass/' + f.f + '/rec.json?shallow=true').then(function (x) { return x.json(); }).then(function (l) {
        var t = Object.keys(l || {}).map(Number).filter(function (x) { return x >= r.recFrom && x <= r.recTo; }).sort()[0];
        if (!t) { b.textContent = '⚠️ Not uploaded yet (the kids app sends it at its next start)'; return; }
        return fget(f.f, 'recdata/' + t).then(function (w) { b.parentNode.innerHTML = '<audio controls autoplay src="data:audio/wav;base64,' + w + '" style="width:100%"></audio>'; });
      }).catch(function () { b.textContent = '⚠️ Could not load'; }); }
  };
}
function tabKids(f) {
  var ks = C.kidList(f.cfg); if (!ks.length) { $('body').innerHTML = '<div class="card mute">No children added yet.</div>'; return; }
  Promise.all(ks.map(function (k) { return fget(f.f, 'prog/' + k.id).catch(function () { return null; }); })).then(function (ps) {
    $('body').innerHTML = ks.map(function (k, i) { var p = C.normProg(ps[i]), map = '', weak = Object.keys(p.weak || {}).slice(0, 8);
      for (var t = +k.from; t <= +k.to && t - k.from < 30; t++) { var st = p.t[t] && p.t[t].st; map += '<i class="' + (st >= 3 ? 'm' : st ? 'c' : '') + '">' + t + '</i>'; }
      return '<div class="card"><div class="row"><span style="font-size:28px">' + E(k.emoji) + '</span><div class="sp"><h2>' + E(k.name) + '</h2><div class="mute">' + E(C.stdName(k.std)) + ' · tables ' + E(k.from) + '-' + E(k.to) + ' · ' + E(C.styleName(k.style)) + ' · class ' + E(k.time || '') + '</div></div></div>' +
        '<div class="map">' + map + '</div>' + (weak.length ? '<div style="margin-top:6px">' + weak.map(function (w) { return '<span class="chip r">weak ' + E(w.replace('x', ' × ')) + '</span>'; }).join('') + '</div>' : '') + '</div>';
    }).join('');
  });
}
function tabDev(f) {
  var ks = Object.keys(f.dev); if (!ks.length) { $('body').innerHTML = '<div class="card mute">No devices linked yet.</div>'; return; }
  $('body').innerHTML = '<div class="card">' + ks.map(function (k) { var d = f.dev[k];
    return '<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b><span class="dot' + (Date.now() - (d.at || 0) < 180000 ? '' : ' off') + '"></span>' + E(d.name || k) + '</b> <span class="mute">' + E(d.kind || '') + '</span><div class="mute">' +
      E(d.model || '') + ' · screen v' + E(d.ver || '?') + ' · app ' + E(d.app || '?') + ' · voice ' + E(d.voice || '?') + (d.engine ? ' (' + E(String(d.engine).replace('com.google.android.tts', 'Google')) + ')' : '') + ' · last seen ' + ago(d.at) + '</div></div>'; }).join('') + '</div>';
}
function tabLive(f) {
  fget(f.f, 'live').then(function (lv) {
    var on = Object.keys(lv || {}).filter(function (k) { return lv[k] && lv[k].on && Date.now() - (lv[k].at || 0) < 120000; });
    $('body').innerHTML = on.length ? on.map(function (k) { var l = lv[k], kid = (f.cfg.kids || {})[k] || {};
      return '<div class="card" style="background:#14122b;color:#f3f1ff"><div class="row"><b class="sp">👀 ' + E(kid.name || k) + ' · ' + E(l.devName || '') + '</b><span class="chip r">● LIVE</span></div><div style="text-align:center;font:800 32px \'Baloo 2\';margin:12px 0">' + E(l.q || '') + '</div><div style="text-align:center;opacity:.8">' + E(l.title || '') + (l.p ? ' · 🎤 "' + E(l.p) + '"' : '') + '</div></div>'; }).join('') + '<button class="btn soft" id="lr">⟳ Refresh</button>'
      : '<div class="card mute">No class is on right now.</div>';
    if ($('lr')) $('lr').onclick = function () { tabLive(f); };
  });
}
function tabLog(f) {
  var day = new Date(Date.now() + 19800000).toISOString().slice(0, 10), ks = Object.keys(f.dev);
  Promise.all(ks.map(function (k) { return fget(f.f, 'diag/' + k + '/' + day).catch(function () { return null; }); })).then(function (ls) {
    $('body').innerHTML = ks.map(function (k, i) { var l = ls[i] || {}, lines = Object.keys(l).map(function (x) { return l[x]; }).sort(function (a, b) { return a.t - b.t; }).slice(-120)
      .map(function (e) { return new Date(e.t + 19800000).toISOString().slice(11, 19) + ' ' + e.m; }).join('\n');
      return '<div class="card"><div class="row"><b class="sp">' + E((f.dev[k] || {}).name || k) + ' · today</b><button class="btn soft" data-lc="' + i + '">📋 Copy</button></div><pre>' + E(lines || 'nothing today') + '</pre></div>'; }).join('') || '<div class="card mute">No devices.</div>';
    $('body').onclick = function (e) { var b = e.target.closest('[data-lc]'); if (b) copy(b.parentNode.parentNode.querySelector('pre').textContent, b); };
  });
}
load();
/* v2 (user, 09-Nov: "the link clashes with the staff web app"): its OWN installable app (own manifest id + scope = this page only, own worker scope) - PWA rule */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('app-sw.js', { scope: './homeclass-admin.html' }).catch(function () {});
})();
</script></body></html>
