input,select{font:700 14px Nunito;padding:9px 10px;border-radius:12px;border:1.5px solid var(--line);width:100%;margin:4px 0;background:#fff;color:var(--ink)}label.f{display:block;font:800 12px Nunito;color:var(--mute);margin-top:6px}

.modal{position:fixed;inset:0;background:rgba(20,18,43,.55);z-index:40;display:grid;place-items:center;padding:16px}.modal>div{background:#fff;border-radius:22px;padding:16px;max-width:430px;width:100%;max-height:88vh;overflow:auto}
.chip.plan{border:1.5px dashed #b9a300;background:#fffbe0;color:#7a6500}
