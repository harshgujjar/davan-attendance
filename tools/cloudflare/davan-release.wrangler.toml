# Deploy settings for the Cloudflare Worker "davan-release" (nightly widget release timer + log requests).
# Used by .github/workflows/deploy-worker.yml - the GitHub job deploys the worker whenever its code changes.
# The worker's secret GH_TOKEN stays in Cloudflare (a deploy keeps existing secrets).
name = "davan-release"
main = "../cloudflare-release-worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
# 9:15 pm IST + 9:45 pm backup (release); v4: the college scraper, every 15 min 07-12 UTC Mon-Sat, the worker starts it only at
# 07:30 / 08:15 / 12:00 / 12:45 UTC = 1:00 / 1:45 / 5:30 / 6:15 pm IST (Cloudflare times are UTC)
crons = ["45 15 * * *", "15 16 * * *", "0,15,30,45 7,8,12 * * MON-SAT"]
