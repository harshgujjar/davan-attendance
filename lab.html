<html lang="en">
<head>

<style>
:root{--bg:#0b0d11;--surface:#12151b;--surface2:#1a1e27;--border:#252a35;--accent:#f0a500;--blue:#3b82f6;--danger:#ef4444;--warn:#f59e0b;--ok:#22c55e;
 --text:#e4e8f0;--muted:#b8c4d0;--dim:#7c8696;--head:'Bebas Neue',sans-serif;--body:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--radius:10px;
 --g:#22c55e;--y:#facc15;--o:#fb923c;--r:#ef4444;--p:#a78bfa;--k:#4b5563}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
button{font-family:var(--body);cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px}
header.top{position:sticky;top:0;z-index:20;background:rgba(11,13,17,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--head);font-size:26px;letter-spacing:1px;color:var(--accent);line-height:1}
.brand small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:0}
.sp{flex:1}
.bkitem{border-top:1px solid var(--border);padding:10px 0 4px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 11px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:10px 0}
.card h3{margin:0 0 8px;font-family:var(--head);font-weight:400;font-size:20px;letter-spacing:.6px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.mono{font-family:var(--mono)}.small{font-size:12px}.tiny{font-size:11px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px}
.btn.ac{background:var(--accent);border-color:var(--accent);color:#111;font-weight:600}
.btn.red{border-color:#7f1d1d;background:#2a1215;color:#fecaca}.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:var(--body);font-size:14px;max-width:100%}
textarea{font-family:var(--mono);font-size:12px;width:100%;min-height:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.tile{position:relative;border-radius:10px;padding:8px 6px 7px;text-align:center;background:var(--surface2);border:1px solid var(--border);cursor:pointer;min-height:66px}
.tile b{display:block;font-size:15px}.tile .st{font-size:18px;line-height:1.1}.tile .mini{font-size:10px;color:var(--muted);font-family:var(--mono)}
.tile.lv-green{border-color:#14532d}.tile.lv-yellow{border-color:#713f12}.tile.lv-orange{border-color:#7c2d12}.tile.lv-red{border-color:#7f1d1d;background:#1f1012}
.tile.lv-purple{border-color:#4c1d95}.tile.lv-off{opacity:.55}
.tile.lv-red::after{content:'';position:absolute;inset:-2px;border-radius:11px;border:2px solid var(--r);animation:pulse 1.6s infinite}
@keyframes pulse{0%{opacity:.9}70%{opacity:0}100%{opacity:0}}
.tile .fire{position:absolute;top:2px;right:4px;font-size:11px}.tile .old{position:absolute;top:2px;left:4px;font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.bar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}.kv>div:nth-child(odd){color:var(--muted)}
.alert{border-radius:10px;padding:10px 12px;margin:8px 0;border:1px solid}
.alert.red{background:#1f1012;border-color:#7f1d1d}.alert.amber{background:#1f170b;border-color:#78350f}.alert.blue{background:#0d1626;border-color:#1e3a8a}.alert.purple{background:#170f26;border-color:#4c1d95}.alert.green{background:#0c1a12;border-color:#14532d}

nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,21,27,.97);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}

.menu .pane{position:absolute;right:0;top:0;bottom:0;width:min(320px,86vw);background:var(--surface);border-left:1px solid var(--border);padding:14px;overflow:auto}

.menu .pane button:hover,.menu .pane button.on{background:var(--surface2)}
.tl{border-left:2px solid var(--border);margin-left:6px;padding-left:12px}.tl .d{font-family:var(--mono);font-size:12px;color:var(--accent);margin:10px 0 4px}
.tl .e{font-size:13px;margin:3px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;max-width:92vw;font-size:13px;display:none}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#334155;color:#fff;font-weight:600;overflow:hidden;flex-shrink:0}
.sw{position:relative;display:inline-block;width:40px;height:22px}.sw input{opacity:0;width:0;height:0}.sw i{position:absolute;inset:0;background:var(--border);border-radius:22px;transition:.2s}
.sw i::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+i{background:var(--ok)}.sw input:checked+i::before{transform:translateX(18px)}
.ai{white-space:pre-wrap;background:var(--surface2);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:14px;line-height:1.45}
.ai.me{background:#1d2433}
.frame{position:relative;width:100%;height:72vh;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#000}

body.embed header.top{position:static}
</style>

<script>
/* 🖥️ Davan PC Doctor Console (lab.html) - ROADMAP-pcdoctor.md 10. Super Admin only. Data: DB5 (Firebase davan-lab) over REST with a custom
   token from the worker davan-release /lab/tok (staff login -> Super Admin check). Opens inside the staff app (?embed=1) or on its own
   (installable, same staff login). Reads summaries (lab/now, lab/pcs, lab/load), never raw minute rows except "just before the freeze".
   Changelog: CHANGELOG-lab.md. Versions: pcdoctor/lab-version.json (console.build = LAB_BUILD below). */
const LAB_BUILD = 22, LAB_VER = '1.' + LAB_BUILD;
try { document.getElementById('brandVer').textContent = 'v' + LAB_VER; } catch (e) {}   // 1.6 (user, 05-Nov-2026): version always under the name
const DEL_SW = ['clean_temp', 'spooler', 'startup_off', 'android_clean'];   // fixes that delete: never automatic (strict rule 04-Nov)
const WK = 'https://davan-release.harshgujjar.workers.dev', DB5 = 'https://davan-lab-default-rtdb.asia-southeast1.firebasedatabase.app', K5 = 'AIzaSyAdebhgQpyjd3ZQgUl_UNhLXYUDRJK1C1s';
const RAW = 'https://raw.githubusercontent.com/harshgujjar/davan-attendance/main/pcdoctor/';
const STAFF_CFG = { apiKey: 'AIzaSyBUuOH-GLPHhcz9a3fIT5ewVcyaZyCguto', authDomain: 'davan-attendance-2026.firebaseapp.com', projectId: 'davan-attendance-2026' };
const EMBED = new URLSearchParams(location.search).get('embed') === '1';
if (EMBED) document.body.classList.add('embed');
const L = { tok: '', exp: 0, rt: '', pcs: {}, now: {}, cfg: {}, ws: {}, ver: {}, lv: null, sum: null, load: {}, cmd: {}, res: {}, fix: [], page: 'lab', pc: null, grp: '', err: '', t0: Date.now(), ai: [], aiPc: {} };
const LV = { green: ['🟢', 'var(--g)', 'Healthy'], yellow: ['🟡', 'var(--y)', 'Look soon'], orange: ['🟠', 'var(--o)', 'Problem'], red: ['🔴', 'var(--r)', 'Urgent'], purple: ['🟣', 'var(--p)', 'Lab-wide'], off: ['⚫', 'var(--k)', 'Off / not reporting'], stuck: ['🟠', 'var(--o)', 'On but stuck'], never: ['⚪', 'var(--k)', 'Never reported'] };
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const plural = (n, w, ws) => n + ' ' + (n === 1 ? w : (ws || w + 's'));
const ist = ms => ms ? new Date(ms).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true }).replace(/\s?(am|pm)$/i, m => ' ' + m.trim().toLowerCase()) + ' IST' : '—';
const istDay = ms => new Date((ms || Date.now()) + 5.5 * 3600e3).toISOString().slice(0, 10);
const ago = ms => { if (!ms) return 'never'; const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'just now' : m < 60 ? plural(m, 'min') + ' ago' : m < 1440 ? plural(Math.round(m / 60), 'hour') + ' ago' : plural(Math.round(m / 1440), 'day') + ' ago'; };
function toast(t, ms) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => e.style.display = 'none', ms || 3500); }
async function copyText(t, btn) {   // 📋 Copy on every report / log / list (dvCopyText in the staff app)
  try { if (EMBED && parent.dvCopyText) return parent.dvCopyText(t, btn); await navigator.clipboard.writeText(t); } catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  if (btn) { const o = btn.textContent; btn.textContent = '✅ Copied'; setTimeout(() => btn.textContent = o, 1500); } else toast('📋 Copied');
}
const cpBtn = (id, label) => '<button class="btn sm" onclick="copyText(window.__cp[\'' + id + '\'],this)">📋 ' + (label || 'Copy') + '</button>';
window.__cp = {};

/* ---------- login (1.3, user 04-Nov-2026: "the staff login and the lab.html login must be different - logging in here logged in the staff app
   and made its sound"): on its own the Console uses its OWN PC Doctor password (worker /lab/tok {pw}) and never touches the staff login;
   inside the staff app (?embed=1) it uses the Super Admin who is already logged in there (no new login, no sound). The DB5 session is kept
   on this device (localStorage lab_rt) until 🚪 Log out. ---------- */
async function staffToken() {
  try { if (EMBED && parent.auth && parent.auth.currentUser) return await parent.auth.currentUser.getIdToken(); } catch (e) {}
  return null;
}
try { L.rt = localStorage.getItem('lab_rt') || ''; } catch (e) {}
function saveRt(rt) { L.rt = rt || ''; try { rt ? localStorage.setItem('lab_rt', rt) : localStorage.removeItem('lab_rt'); } catch (e) {} }
async function customLogin(tok) {
  const t = await (await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=' + K5, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: tok, returnSecureToken: true }) })).json();
  if (!t.idToken) throw new Error('DB5 login refused: ' + JSON.stringify(t.error || t).slice(0, 120));
  L.tok = t.idToken; L.exp = Date.now() + (+t.expiresIn - 300) * 1000; saveRt(t.refreshToken); return L.tok;
}
function logout() { saveRt(''); L.tok = ''; L.exp = 0; location.hash = ''; loginBox('Logged out.'); }
async function db5Tok() {
  if (L.tok && Date.now() < L.exp) return L.tok;
  if (L.rt) { try { const r = await (await fetch('https://securetoken.googleapis.com/v1/token?key=' + K5, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + L.rt })).json();
    if (r.id_token) { L.tok = r.id_token; L.exp = Date.now() + (+r.expires_in - 300) * 1000; if (r.refresh_token) saveRt(r.refresh_token); return L.tok; } } catch (e) {}
    saveRt(''); }
  const st = await staffToken(); if (!st) throw new Error('LOGIN');
  let r; try { r = await (await fetch(WK + '/lab/tok', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ token: st }) })).json(); } catch (e) { throw new Error('WORKER: ' + e.message); }
  if (!r.ok) throw new Error(/DB5 key/.test(r.msg) ? 'NOKEY' : r.msg);
  return customLogin(r.token);
}
async function db(method, path, body, q) {
  const r = await fetch(DB5 + '/' + path + '.json?auth=' + await db5Tok() + (q ? '&' + q : ''), { method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (!r.ok) throw new Error('DB5 ' + r.status + ' ' + path);
  return r.json();
}
const g = (p, q) => db('GET', p, undefined, q), put = (p, v) => db('PUT', p, v), patch = (p, v) => db('PATCH', p, v), del = p => db('DELETE', p);
async function wk(route, body) { const tok = await db5Tok(); return (await fetch(WK + route, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ token: tok }, body || {})) })).json(); }
</script>
<script>
/* ---------- data ---------- */
async function loadAll(quiet) {
  const day = istDay(), yday = istDay(Date.now() - 864e5);
  const [pcs, now, cfg, ws, ver, sum, load, cmd, f1, f2, lv] = await Promise.all([g('lab/pcs'), g('lab/now'), g('lab/cfg'), g('lab/wstate'), g('lab/ver'), g('lab/sum/' + day), g('lab/load/' + day),
    g('lab/cmd'), g('lab/fixlog/' + day), g('lab/fixlog/' + yday), fetch(RAW + 'lab-version.json?t=' + Date.now()).then(r => r.json()).catch(() => null)]);
  Object.assign(L, { pcs: pcs || {}, now: now || {}, cfg: cfg || {}, ws: ws || {}, ver: ver || {}, sum, load: load || {}, cmd: cmd || {}, lv: lv || L.lv, at: Date.now() });
  L.fix = []; for (const [d, x] of [[day, f1], [yday, f2]]) for (const [h, fs] of Object.entries(x || {})) for (const [k, f] of Object.entries(fs || {})) L.fix.push(Object.assign({ h, k, d }, f));
  L.fix.sort((a, b) => b.t - a.t);
  if (!quiet) render();
}
async function loadNow() { try { L.now = (await g('lab/now')) || {}; L.at = Date.now(); if (['dash', 'lab', 'office', 'disk'].includes(L.page)) render(true); } catch (e) {} }
const cfgThr = (k, d) => ((L.cfg.thr || {})[k] != null ? +L.cfg.thr[k] : d);
const pcName = h => { const p = L.pcs[h] || {}; return p.name || p.win || (L.now[h] || {}).name || h; };
const natural = (a, b) => String(a).localeCompare(String(b), 'en', { numeric: true });
function groups() { return L.cfg.groups || {}; }
function grpOf(h) { const p = L.pcs[h] || {}; if (p.grp && groups()[p.grp]) return p.grp; const n = pcName(h); let best = '';
  for (const k of Object.keys(groups())) if (n.toUpperCase().startsWith(k) && /^\d+$/.test(n.slice(k.length)) && k.length > best.length) best = k; return best; }
function grpName(k) { const x = groups()[k]; return x ? (x.icon ? x.icon + ' ' : '') + x.name : (k ? k : '📥 New'); }
function activePcs() { return Object.keys(Object.assign({}, L.pcs, L.now)).filter(h => !(L.pcs[h] || {}).old && !(L.pcs[h] || {}).mergedInto); }
function dupNames() { const c = {}; activePcs().forEach(h => { const n = pcName(h).toUpperCase(); c[n] = (c[n] || 0) + 1; }); return c; }
/** the state of one PC: level, emoji, words - "off" vs "on but stuck" from the peers' pings (6) */
function pcState(h) {
  const n = L.now[h], p = L.pcs[h] || {};
  if (!n || !n.t) return { lv: 'never', v: 'Never reported', why: 'Installed but no minute row yet - is PC Doctor running? (Check the PC or run PCDoctor-Setup.cmd again.)' };
  const offMin = cfgThr('offMin', 30), age = (Date.now() - n.t) / 60000;
  if (age > cfgThr('silentMin', 10)) {
    const seen = activePcs().some(o => o !== h && L.now[o] && Date.now() - L.now[o].t < 15 * 60000 && (L.now[o].pp || {})[h] === 1);
    if (seen) return { lv: 'stuck', v: 'On but stuck', why: 'Its neighbours still get a ping answer, but PC Doctor stopped reporting ' + ago(n.t) + ' - Windows is frozen or very busy. Use 🖥️ Remote screen or check it by hand.' };
    if (age > offMin || age > 15) return { lv: 'off', v: 'Off', why: 'No report since ' + ist(n.t) + ' and no ping answer - switched off, or stuck before Windows starts (check by hand).' };
  }
  const lv = n.lv || 'green';
  return { lv, v: n.v || 'Healthy', why: n.why || '', conf: n.conf, fix: n.fix };
}
/** many PCs of a group went silent / got the same problem at once -> 🟣 lab-wide (network / server / update) */
function labWide() {
  const out = [], N = +L.cfg.labWideN || 5, by = {};
  for (const h of activePcs()) { const s = pcState(h), gk = grpOf(h); if (!gk) continue;
    if (s.lv === 'off' || s.lv === 'stuck') { const t = (L.now[h] || {}).t || 0; (by[gk + '|silent'] = by[gk + '|silent'] || []).push([h, t]); }
    else if (['orange', 'red', 'yellow'].includes(s.lv) && (L.now[h] || {}).vk) (by[gk + '|' + L.now[h].vk] = by[gk + '|' + L.now[h].vk] || []).push([h, 0]); }
  for (const [k, list] of Object.entries(by)) { if (list.length < N) continue; const [gk, what] = k.split('|');
    if (what === 'silent') { const ts = list.map(x => x[1]).sort(); if (ts[ts.length - 1] - ts[0] > 20 * 60000 && ts[0]) continue; }
    out.push({ gk, what, list: list.map(x => x[0]) }); }
  return out;
}
// 1.9 (user, 05-Nov-2026): a build published in the last 3 hours is not "old" yet - every PC updates within the hour by itself
function oldAgent(h) { const b = (L.ver[h] || {}).build, a = L.lv && L.lv.agent ? L.lv.agent : null; if (!b || !a || !a.build || b >= a.build) return false;
  const nx = (L.lv.news || []).filter(x => x.build > b).sort((x, y) => x.build - y.build)[0];   // the first build this PC is missing

// shows every step live (agent 1.47 writes lab/res/<h>/<id>.steps), with 📋 Copy; old agents only answer at the end
async function meshInstall(h) {
  L.pc = h;
  const n = L.now[h] || {}, on = n.t && Date.now() - n.t < 3 * 60000, lines = [];
  const box = () => { const t = lines.join('\n'); window.__cp.minst = pcName(h) + ' - remote agent install\n' + t;
    $('meshBox').innerHTML = '<div class="card"><h3>🖥️ Remote agent on ' + esc(pcName(h)) + '</h3><pre class="small" style="white-space:pre-wrap;margin:0">' + esc(t) + '</pre><div class="row" style="margin-top:6px">' + cpBtn('minst') + '<button class="btn sm" onclick="meshInstall(\'' + h + '\')">🔁 Try again</button></div></div>'; };
  const add = x => { lines.push(new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(11, 19) + ' ' + x); box(); };
  add('Console: ' + pcName(h) + ' has no remote id yet. PC Doctor agent ' + (n.ver || '?') + ', Deep Freeze ' + (n.df || '?') + ', last seen ' + ago(n.t) + '.');
  if (!on) return add('❌ ' + pcName(h) + ' is not online (last seen ' + ago(n.t) + '). Switch it on / check its network, then 🔁 Try again.');

async function sha256t(t) { return sha(new TextEncoder().encode(t)); }
async function setTrayPw() { const a = prompt('New tray password (digits or letters, 4+):'); if (!a) return; if (a.length < 4) return toast('At least 4 characters'); if (prompt('Type it again:') !== a) return toast('Did not match');
  await patch('lab/cfg', { trayPw: await sha256t('davanlab:' + a) }); toast('🔒 Tray password changed - every PC uses it within the hour'); }
async function saveConsolePw() { const a = $('cp1').value, b = $('cp2').value;   // 1.4: inline form with 👁 Show (user, 05-Nov-2026)
  if (a.length < 6) return toast('At least 6 characters'); if (a !== b) return toast('The two passwords are not the same');
  const r = await wk('/lab/setpw', { pw: a }); if (r.ok) { $('cp1').value = $('cp2').value = ''; } toast(r.ok ? '🔒 PC Doctor password saved - use it to open lab.html on any device' : (r.msg || 'Not saved'), 5000); }

async function copySecret(name, btn) { const r = await wk('/lab/secret', { name }); if (!r.ok || !r.has) return toast(r.msg || 'Not saved yet'); copyText(r.text, btn); }
async function saveJson(key, id) { let v; try { v = JSON.parse($(id).value); } catch (e) { return toast('Not valid JSON: ' + e.message); } await put('lab/cfg/' + key, v); toast('💾 Saved - every PC uses it within the hour'); loadAll(true); }
async function saveRules() { let v; try { v = JSON.parse($('s-rules').value); } catch (e) { return toast('Not valid JSON: ' + e.message); }
  if (!Array.isArray(v) || v.some(r => !r.id || !r.lv || !r.v || !(r.all || r.any))) return toast('Each rule needs id, lv, v and all / any');
  const gone = (L.cfg.rules || []).map(r => r.id).filter(i => !v.some(r => r.id === i)); await patch('lab/cfg', { rules: v, rulesOff: [...new Set([...(L.cfg.rulesOff || []), ...gone])] }); toast('💾 Rules saved'); loadAll(true); }

function loginBox(msg) {

    '<input id="lp" type="password" placeholder="PC Doctor password" style="width:100%;margin-top:10px" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()">' +

    '<button class="btn ac" style="width:100%;margin-top:10px" onclick="doLogin()">Log in</button>' +
    '<div class="tiny dim" style="margin-top:8px">This is PC Doctor\'s own password - not your staff login. First time: open PC Doctor from the staff app (☰ → 🖥️ PC Doctor) → 🔧 Settings → Set PC Doctor password.</div></div>');

async function doLogin() { const p = $('lp').value; if (!p) return;
  try { const r = await (await fetch(WK + '/lab/tok', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ pw: p }) })).json();
    if (!r.ok) return toast(r.msg || 'Login failed', 5000);
    await customLogin(r.token); start(); } catch (e) { toast('Login failed: ' + (e.message || e)); } }
async function start() {
  try { await loadAll(); }
  catch (e) {
    const m = String(e.message || e);
    if (m === 'LOGIN') return loginBox();
    if (m === 'NOKEY') return set('<div class="alert red">🔑 <b>The worker has no DB5 key yet.</b> Cloudflare → Workers → davan-release → Settings → Variables and Secrets → Add → Secret, name <b>DB5_SA</b>, value = the davan-lab service-account JSON → Deploy. (Or add the repo secret DB5_SA and run "Deploy Cloudflare worker".) Then reload.</div>');
    if (/Super Admin only|log in/i.test(m)) return loginBox(m);
    return set('<div class="alert red">📴 <b>Can\'t reach DB5 (PC Doctor\'s database)</b> - ' + esc(m) + '. The PCs keep their data and send it later. <button class="btn sm" onclick="start()">Try again</button></div>');
  }
  const hash = location.hash.slice(1), saved = (() => { try { return [localStorage.getItem('lab_page'), localStorage.getItem('lab_pc')]; } catch (e) { return []; } })();
  if (hash.startsWith('pc=')) go('pc', hash.slice(3)); else if (hash.startsWith('fixes=')) go('fixes', hash.slice(6)); else if (PAGES.some(p => p[0] === hash)) go(hash); else if (saved[0]) go(saved[0], saved[1]); else render();
  setInterval(loadNow, 60000); setInterval(() => loadAll(true).then(() => render(true)).catch(() => {}), 5 * 60000);
  bookOverview().catch(() => {});   // 🩺 badge: ✅ Approve + open problems
  setInterval(selfUpdate, 10 * 60000);
}

    if ((v.console || {}).build > LAB_BUILD && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) location.reload(); } catch (e) {}
}
