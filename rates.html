<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gold, Silver &amp; Currency - Davan</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* rates.html v1.01 (31-Oct-2026) - one-year gold / silver analysis + currencies. Opens from the student and staff widgets (tap) and
   inside the staff app's Rates page (?embed=1). Reads only public DB3 nodes: widgetConfig/news and widgetConfig/newsSourceConfig/ratesInsight. */
:root{--bg:#f3f1ec;--surface:#fff;--surface2:#ece9e2;--border:#d8d3c8;--accent:#b87800;--ok:#15803d;--danger:#dc2626;--warn:#b45309;--text:#1a1d24;--muted:#5b6472;
  --head:'Bebas Neue',sans-serif;--body:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d11;--surface:#12151b;--surface2:#1a1f28;--border:#252a35;--accent:#f0a500;--ok:#22c55e;--danger:#ef4444;--warn:#f59e0b;--text:#e4e8f0;--muted:#b8c4d0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d11;--surface:#12151b;--surface2:#1a1f28;--border:#252a35;--accent:#f0a500;--ok:#22c55e;--danger:#ef4444;--warn:#f59e0b;--text:#e4e8f0;--muted:#b8c4d0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--body);padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font:400 26px var(--head);letter-spacing:1.5px;margin:0;color:var(--accent)}
h2{font:400 18px var(--head);letter-spacing:1.2px;margin:0 0 6px}
.sub{color:var(--muted);font-size:12px;margin:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-width:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.dn{color:var(--danger)}.mut{color:var(--muted)}
.tag{font:500 10.5px var(--mono);letter-spacing:.4px;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 6px;white-space:nowrap}
.tag.pub{color:var(--warn);border-color:var(--warn)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--border);min-width:0}
.row:first-of-type{border-top:0}.row .r{text-align:right}
.big{font:500 24px var(--mono)}.chg{font:500 13px var(--mono)}
.hint{font-size:12px;color:var(--muted)}
.sw{display:flex;gap:6px;overflow-x:auto}
.sw button{flex:1 0 auto;background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font:500 13px var(--body);cursor:pointer;white-space:nowrap}
.sw button[aria-pressed="true"]{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:600}
.sw button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.verdict{border:1px solid var(--vc,var(--warn));border-radius:10px;padding:12px 14px;background:var(--surface)}
.verdict .v{font:400 28px var(--head);letter-spacing:1px;color:var(--vc,var(--warn))}
.rbar{position:relative;height:12px;border-radius:6px;margin:24px 0 6px}
.rbar i{position:absolute;top:-7px;width:3px;height:26px;background:var(--text);border-radius:2px}
.rbar b{position:absolute;top:-22px;font:500 10.5px var(--mono);white-space:nowrap}
.rlab{display:flex;justify-content:space-between;gap:6px;font:500 10.5px var(--mono);color:var(--muted)}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;padding:8px 0;border-top:1px solid var(--border);align-items:baseline}
.step:first-of-type{border-top:0}.step .n{font:500 11px var(--mono);color:var(--muted)}
ul{margin:6px 0 0;padding-left:18px}li{margin:3px 0}
svg text{font-family:var(--mono);fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:16px;border-top:2px solid var(--accent);vertical-align:middle;margin-right:5px}
.legend .d::before{border-top-style:dashed;border-color:var(--muted)}
body.embed{padding-top:0}body.embed h1,body.embed #top .sub{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Loading rates…</p></div>
<script>
/* Davan - rates.html v1.01. All numbers come from the news job (fetch_news.js v1.9.0). Nothing here is typed by hand: limits (buy / sell zone) are in
   widgetConfig/newsSourceConfig/ratesCfg. If the analysis is missing or old, the page still shows today's rates and says so. */
var DB3 = 'https://davan-student-news-default-rtdb.asia-southeast1.firebasedatabase.app/';
var Q = new URLSearchParams(location.search);
if (Q.get('embed')) document.body.classList.add('embed');
if (Q.get('theme') === 'dark' || Q.get('theme') === 'light') document.documentElement.setAttribute('data-theme', Q.get('theme'));
var APP = document.getElementById('app'), STATE = { I: null, N: {}, k: 'silver' };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function inr(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }
function txt(s) { return esc(String(s).replace(/Rs /g, '₹')); }
function chg(o, money) {            /* amount + % in plain words */
  if (!o || typeof o.d !== 'number') return '<span class="mut">collecting data</span>';
  if (!o.d) return '<span class="mut">no change</span>';
  var up = o.d > 0, a = money === false ? Math.abs(o.d).toFixed(2) : inr(Math.abs(o.d));
  return '<span class="' + (up ? 'up' : 'dn') + '">' + (up ? '▲ ' : '▼ ') + '₹' + a.replace('₹', '') + (up ? ' dearer' : ' cheaper') + ' (' + Math.abs(o.p).toFixed(1) + '%)</span>';
}
function dtext(d) { var t = new Date(d + 'T00:00:00Z'); return t.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'UTC' }); }
function pubTag(o) { return o && o.pub ? ' <span class="tag pub">public data</span>' : ''; }
function lakh(v) { return v >= 100000 ? '₹' + (v / 100000).toFixed(v >= 1000000 ? 0 : 2).replace(/\.?0+$/, '') + 'L' : '₹' + Math.round(v / 1000) + 'k'; }
function chart(A) {
  var s = A.series || []; if (s.length < 2) return '<p class="hint">The chart appears when two or more days are saved.</p>';
  var W = 340, H = 200, L = 50, R = 330, T = 14, B = 168, d0 = s[0][0], span = Math.max(1, (Date.parse(s[s.length - 1][0]) - Date.parse(d0)) / 864e5);
  var mn = Math.min.apply(null, s.map(function (p) { return p[1]; })), mx = Math.max.apply(null, s.map(function (p) { return p[1]; }));
  var pad = (mx - mn) * 0.08 || mx * 0.02; mn -= pad; mx += pad;
  function X(d) { return L + ((Date.parse(d) - Date.parse(d0)) / 864e5) / span * (R - L); }
  function Y(v) { return T + (mx - v) / (mx - mn) * (B - T); }
  var out = '', step = (mx - mn) / 4;
  for (var i = 0; i < 5; i++) { var v = mn + step * i; out += '<line x1="' + L + '" x2="' + R + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--border)"/><text x="' + (L - 6) + '" y="' + (Y(v) + 3.5) + '" text-anchor="end" font-size="9.5">' + lakh(v) + '</text>'; }
  var firstOwn = s.findIndex(function (p) { return !p[2]; }); if (firstOwn < 0) firstOwn = s.length - 1;
  function pts(a) { return a.map(function (p) { return X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1); }).join(' '); }
  var pubPart = s.slice(0, firstOwn + 1), ownPart = s.slice(Math.max(0, firstOwn));
  out += '<polygon points="' + pts(s) + ' ' + X(s[s.length - 1][0]) + ',' + B + ' ' + X(d0) + ',' + B + '" fill="var(--accent)" opacity=".10"/>';
  if (pubPart.length > 1) out += '<polyline points="' + pts(pubPart) + '" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>';
  if (ownPart.length > 1) out += '<polyline points="' + pts(ownPart) + '" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>';
  var last = s[s.length - 1], hi = A.hi, lo = A.lo;
  out += '<circle cx="' + X(hi.d) + '" cy="' + Y(hi.v) + '" r="3.5" fill="var(--muted)"/><text x="' + Math.min(X(hi.d) + 8, 230) + '" y="' + (Y(hi.v) + 3) + '" font-size="9.5">High ' + lakh(hi.v) + ' · ' + dtext(hi.d) + '</text>';
  if (lo.d !== hi.d) out += '<circle cx="' + X(lo.d) + '" cy="' + Y(lo.v) + '" r="3" fill="var(--muted)"/>';
  out += '<circle cx="' + X(last[0]) + '" cy="' + Y(last[1]) + '" r="5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/><text x="' + (X(last[0]) - 8) + '" y="' + (Y(last[1]) + 17) + '" text-anchor="end" font-size="10.5" style="fill:var(--text)">Now ' + lakh(last[1]) + '</text>';
  out += '<text x="' + L + '" y="' + (B + 16) + '" font-size="9.5">' + dtext(d0) + '</text><text x="' + R + '" y="' + (B + 16) + '" text-anchor="end" font-size="9.5">' + dtext(last[0]) + '</text>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(A.name) + ' price from ' + dtext(d0) + ' to ' + dtext(last[0]) + '">' + out + '</svg>';
}
function render() {
  var I = STATE.I, N = STATE.N, k = STATE.k, A = I && I[k], nm = { silver: 'Silver', gold24: 'Gold 24K', gold22: 'Gold 22K' };
  var h = '<div id="top"><h1>GOLD · SILVER · CURRENCY</h1><p class="sub">' + esc(N.ratesAsOfText || '') + (N.ratesSource === 'IBJA' ? ' · before 3% GST and making' : '') + (N.ratesNote ? '<br>🔒 ' + esc(N.ratesNote) : '') + '</p></div>';
  h += '<div class="sw" role="group" aria-label="Metal">' + ['silver', 'gold24', 'gold22'].map(function (m) { return '<button aria-pressed="' + (m === k) + '" onclick="pick(\'' + m + '\')">' + (m === 'silver' ? '🥈 ' : '🥇 ') + nm[m] + '</button>'; }).join('') + '</div>';
  if (!A) {
    var cur = k === 'silver' ? N.silverRateKg : k === 'gold24' ? N.gold24Rate : N.gold22Rate;
    h += '<div class="card"><h2>' + nm[k].toUpperCase() + '</h2><div class="big">' + (cur ? inr(+String(cur).replace(/,/g, '')) : '—') + '</div><p class="hint">The full analysis appears after the next rates update (within an hour of the next market day).</p></div>';
  } else {
    A.name = nm[k]; var u = A.unit === 'kg' ? 'kg' : '10 g';
    var cmp = [['Since yesterday', A.ch.day], ['This week', A.ch.week], ['This month', A.ch.month], ['Last 3 months', A.ch.m3], ['This year', A.ch.y1]].filter(function (x) { return x[1]; });
    h += '<div class="card"><h2>' + nm[k].toUpperCase() + '</h2><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="big">' + inr(A.cur) + '<span class="mut" style="font-size:13px"> / ' + u + '</span></span>' +
      (k === 'silver' && N.silverRate ? '<span class="num mut">' + inr(+String(N.silverRate).replace(/,/g, '')) + ' / 10 g</span>' : '') + '</div><div style="margin-top:8px">' +
      cmp.map(function (x) { return '<div class="row"><span>' + x[0] + pubTag(x[1]) + '</span><span class="r chg">' + chg(x[1]) + '</span></div>'; }).join('') +
      (A.vsHi && A.hi.d !== A.asOf ? '<div class="row"><span>From the highest (' + inr(A.hi.v) + ', ' + dtext(A.hi.d) + ')</span><span class="r chg">' + chg(A.vsHi) + '</span></div>' : '') + '</div></div>';
    h += '<div class="card"><h2>' + nm[k].toUpperCase() + ' · PRICE LINE</h2>' + chart(A) +
      '<div class="legend">' + (A.series.some(function (p) { return p[2]; }) ? '<span class="d">Public data (approximate)</span>' : '') + '<span>Davan rates (IBJA)</span></div>' +
      '<p class="hint" style="margin:8px 0 0">' + (A.ownDays < 60 ? 'Our own daily log has ' + A.ownDays + ' days so far and grows every day for a full year; the dashed line uses public prices until then.' : 'The last year of IBJA closing rates, saved every market day.') + '</p></div>';
    var vc = { ok: 'var(--ok)', warn: 'var(--warn)', danger: 'var(--danger)' }[A.tone] || 'var(--warn)', cfg = I.cfg || {};
    h += '<div class="verdict" style="--vc:' + vc + '"><div class="v">' + A.icon + ' ' + esc(A.verdict) + '</div><p style="margin:6px 0 0">' + A.lines.map(txt).join(' ') + '</p></div>';
    if (I.ai && I.ai.text && I.ai.k === I.k) h += '<div class="card"><h2>✨ AI VIEW</h2><span class="tag" style="color:var(--accent);border-color:var(--accent)">✨ AI · College AI</span><p style="margin:8px 0 0">' + esc(I.ai.text) + '</p><p class="hint" style="margin:6px 0 0">Written by AI from the numbers above, ' + esc(new Date(I.ai.at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })) + '. It can be wrong.</p></div>';
    var bp = cfg.buyPct || 30, sp = cfg.sellPct || 70, pos = Math.max(0, Math.min(100, A.pos));
    h += '<div class="card"><h2>WHERE IT STANDS</h2><div class="rbar" style="background:linear-gradient(90deg,var(--ok) 0 ' + bp + '%,var(--warn) ' + bp + '% ' + sp + '%,var(--danger) ' + sp + '% 100%)"><i style="left:calc(' + pos + '% - 1px)"></i><b style="' + (pos > 70 ? 'right:' + (100 - pos) + '%' : 'left:' + pos + '%') + '">NOW ' + lakh(A.cur) + '</b></div>' +
      '<div class="rlab"><span>BUY up to ' + inr(A.buyBelow) + '</span><span>WAIT</span><span>SELL from ' + inr(A.sellFrom) + '</span></div>' +
      '<p class="hint" style="margin:8px 0 0">Zones are the bottom ' + bp + '%, middle ' + (sp - bp) + '% and top ' + (100 - sp) + '% of the last year\'s range (' + inr(A.lo.v) + ' to ' + inr(A.hi.v) + ').' +
      (A.avg30 ? ' Average of the last 30 days: ' + inr(A.avg30) + (A.cur < A.avg30 ? ' (today is ' + inr(A.avg30 - A.cur) + ' lower).' : ' (today is ' + inr(A.cur - A.avg30) + ' higher).') : '') + '</p></div>';
    if (A.plan && A.plan.length) h += '<div class="card"><h2>WHAT TO DO · EXAMPLE ₹' + (cfg.planAmount || 50000).toLocaleString('en-IN') + '</h2>' +
      A.plan.map(function (p) { return '<div class="step"><span class="n">' + esc(p.k) + '</span><span>' + txt(p.t) + '</span><span class="num mut">' + (p.at ? inr(p.at) : 'hold') + '</span></div>'; }).join('') + '</div>';
    if (A.zone === 'sell') h += '<div class="card"><h2>WHEN TO SELL</h2><p style="margin:0">' + nm[k] + ' is in the top ' + (100 - sp) + '% of its range. If you hold it and need money, consider selling a part now' + (A.hot ? ', because it is also well above its 90-day average.' : '.') + ' Do not sell everything at once: sell in 2 or 3 parts.</p></div>';
    h += '<div class="card"><h2>WATCH OUT</h2><ul><li>These are IBJA rates, before 3% GST' + (k === 'silver' ? ' (about ' + '₹' + (A.cur / 1000 * 1.03).toFixed(2) + ' per gram with GST)' : '') + ' and making charges.</li><li>No new rate on Saturday, Sunday or holidays.</li>' +
      (k === 'silver' ? '<li>Silver moves 2 to 3 times more than gold. Use money you can leave for 2 to 3 years.</li>' : '<li>Gold 22K is for jewellery, 24K for coins and bars.</li>') + '<li>Made by the app from the rates, not by a person. General guidance, not financial advice.</li></ul></div>';
  }
  var fx = Array.isArray(N.fx) ? N.fx : [], wk = (N.ratesWeekChg && N.ratesWeekChg.fx) || {}, dy = (N.ratesChg && N.ratesChg.fx) || {};
  if (fx.length) h += '<div class="card"><h2>💱 CURRENCY</h2><p class="sub">' + esc(N.fxAsOfText ? 'Rates of ' + N.fxAsOfText : '') + '</p>' + fx.map(function (x) {
    return '<div class="row"><span>' + esc((x.f || '') + ' ') + '<span>' + esc(x.k || x.c) + '</span> <span class="mut">' + esc(x.c) + '</span></span><span class="r"><b class="num">₹' + esc(x.r || '—') + '</b><br>' +
      '<span class="chg">' + chg(dy[x.c], false).replace('collecting data', 'today: collecting data') + ' <span class="mut">today</span></span><br><span class="chg">' + chg(wk[x.c], false) + ' <span class="mut">week</span></span></span></div>'; }).join('') +
    (N.usdInrRate && wk.USD && wk.USD.d ? '<p class="hint" style="margin:8px 0 0">$1,000 now costs ' + inr(N.usdInrRate * 1000) + ', which is ' + inr(Math.abs(wk.USD.d) * 1000) + (wk.USD.d > 0 ? ' more' : ' less') + ' than a week ago.</p>' : '') + '</div>';
  APP.innerHTML = h;
}
function pick(k) { STATE.k = k; render(); try { localStorage.setItem('rates_metal', k); } catch (e) {} if (window.parent !== window) { try { parent.postMessage({ ratesHeight: document.documentElement.scrollHeight }, '*'); } catch (e) {} } }
async function load() {
  try { STATE.k = Q.get('m') || localStorage.getItem('rates_metal') || 'silver'; } catch (e) { STATE.k = Q.get('m') || 'silver'; }
  if (['silver', 'gold24', 'gold22'].indexOf(STATE.k) < 0) STATE.k = 'silver';
  try {
    var r = await Promise.all([fetch(DB3 + 'widgetConfig/news.json').then(function (x) { return x.json(); }).catch(function () { return {}; }), fetch(DB3 + 'widgetConfig/newsSourceConfig/ratesInsight.json').then(function (x) { return x.json(); }).catch(function () { return null; })]);
    STATE.N = r[0] || {}; STATE.I = r[1] && r[1].silver !== undefined ? r[1] : null; render();
    if (window.parent !== window) { try { parent.postMessage({ ratesHeight: document.documentElement.scrollHeight }, '*'); } catch (e) {} }
  } catch (e) { APP.innerHTML = '<p class="sub">Could not load the rates. Check the internet and try again.</p>'; }
}
load();
</script>
</body>
</html>
