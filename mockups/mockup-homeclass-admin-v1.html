<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HC Admin V1 mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2ff;--card:#fff;--ink:#22223b;--mute:#6b6b85;--line:#e7e6f5;--brand:#5b4bff;--good:#16b46c;--bad:#ff7a45;--live:#ff4d6d;--gold:#ffb703;--shadow:0 6px 22px rgba(60,50,160,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
h1,h2,h3{font-family:'Baloo 2',Nunito,sans-serif;margin:0}h1{font-size:23px}h2{font-size:18px}
#bar{background:#14122b;color:#fff;padding:7px 12px;font:800 11px Nunito;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#bar button{border:0;border-radius:999px;padding:5px 10px;font:800 11px Nunito;background:#2b2760;color:#fff}
#wrap{max-width:480px;margin:0 auto;padding:10px 12px 90px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:13px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}.mute{color:var(--mute);font-size:13px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;background:rgba(91,75,255,.08);font:800 12px Nunito;margin:2px 3px 0 0}
.chip.g{background:rgba(22,180,108,.14);color:#0d7a48}.chip.r{background:rgba(255,77,109,.13);color:#c9184a}.chip.y{background:rgba(255,183,3,.2);color:#8a5a00}.chip.plan{border:1.5px dashed #b9a300;background:#fffbe0;color:#7a6500}
.btn{border:0;border-radius:999px;padding:10px 14px;font:900 14px Nunito;background:var(--brand);color:#fff;width:100%;margin-top:8px;cursor:pointer}
.btn.soft{background:rgba(91,75,255,.1);color:var(--brand)}.btn.red{background:var(--live)}.btn.off{background:#f3d36b;color:#5a4400}.btn.on{background:#1E7B3A;color:#fff}.btn.good{background:var(--good)}.btn[disabled]{opacity:.45}
.fix{border:0;border-radius:999px;padding:6px 12px;font:900 12px Nunito;background:var(--good);color:#fff;white-space:nowrap;cursor:pointer}.fix.g{background:#aaa}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--good)}.dot.off{background:#bbb}.dot.bad{background:var(--live)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi div{background:#fff;border-radius:14px;padding:8px;text-align:center;box-shadow:var(--shadow)}.kpi b{display:block;font:800 21px 'Baloo 2'}.kpi span{font-size:11px;color:var(--mute)}
.tabs{display:flex;gap:5px;overflow-x:auto;margin:8px 0}.tabs span{flex:0 0 auto;padding:6px 10px;border-radius:12px;background:#fff;font:800 12px Nunito;color:var(--mute);cursor:pointer}.tabs span.on{background:var(--ink);color:#fff}
.prob{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.prob:last-child{border:0}
.tl{border-left:3px solid var(--line);margin-left:8px;padding-left:12px}.tl div{position:relative;padding:5px 0;font-size:13px}.tl div:before{content:'';position:absolute;left:-19px;top:10px;width:11px;height:11px;border-radius:50%;background:var(--good)}.tl div.x:before{background:var(--live)}.tl div.u:before{background:var(--gold)}.tl div.s:before{background:#aaa}
.note{font-size:12px;color:var(--mute);background:rgba(255,183,3,.12);border-radius:12px;padding:8px 10px;margin:8px 0}
input,select{font:700 14px Nunito;padding:9px 10px;border-radius:12px;border:1.5px solid var(--line);width:100%;margin:4px 0;background:#fff;color:var(--ink)}
label.f{display:block;font:800 12px Nunito;color:var(--mute);margin-top:6px}
.dark{background:#14122b;color:#f3f1ff;border-radius:20px;padding:13px;margin:10px 0}.dark .mute{color:#a9a4d6}.big{font:800 34px 'Baloo 2'}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -6px 22px rgba(60,50,160,.12);display:flex;justify-content:center;z-index:10}
.nav div{display:flex;max-width:480px;width:100%}.nav button{flex:1;border:0;background:none;padding:9px 2px;font:800 11px Nunito;color:var(--mute);cursor:pointer}.nav button.on{color:var(--brand)}.nav button span{display:block;font-size:19px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#22223b;color:#fff;padding:10px 16px;border-radius:14px;font:800 13px Nunito;z-index:50;max-width:92%}
.modal{position:fixed;inset:0;background:rgba(20,18,43,.55);z-index:40;display:grid;place-items:center;padding:16px}.modal>div{background:#fff;border-radius:22px;padding:16px;max-width:430px;width:100%;max-height:88vh;overflow:auto}
pre{white-space:pre-wrap;font:600 12px ui-monospace,Menlo,monospace;background:#14122b;color:#d8d4ff;border-radius:14px;padding:10px;margin:6px 0}
</style></head><body>
<div id="bar"><b>🛠️ HC ADMIN V1 - a separate app (own icon, own link). Never part of Home Class.</b><button onclick="reset()">↺ Reset demo</button></div>
<div id="wrap"></div><div class="nav"><div id="nav"></div></div><div id="layer"></div>
<script>
var AV={app:'v1'};
function fresh(){return{tab:'fam',fam:null,ft:'children',sev:'',filter:'all',
 doc:{rules:{mic:true,voice:true,old:true,crash:true,hear:true},auto:{voice:true,update:true,micask:true},last:'20:00',alerts:true},
 rel:{kid:'v89',apk:'h28',next:'h28',floor:'v60',floorApk:'h24',stop:'',channel:'stable',tester:['Gujjar'],hist:['09-Nov 22:51 kids v89 live','08-Nov 23:25 kids v76 live','08-Nov 22:24 app h28 live']},
 set:{nightly:true,keyExp:'GitHub token: 142 days left',cleanLog:90,cleanDays:400,cleanClips:30,wa:'9844542132'},
 fams:[
  {id:'f1',name:'Gujjar family',key:'…SJZR',tester:true,joined:'1 Nov',susp:false,deleted:false,last:'23:31',hear:81,rec:true,gh:true,tv:true,chan:'tester',
   kids:[{n:'Vihaan',s:'2nd',e:'🦁',st:46,wk:['9×7','9×8'],mis:'7×8: 56 heard as 63',sp:{bones:'✓',muscles:'✗'},idle:0},{n:'Aryan',s:'7th',e:'🐯',st:120,wk:['17×8'],mis:'',sp:{},idle:5}],
   devs:[{n:'Living room TV',mk:'Sony BRAVIA',v:'v89',h:'h28',on:true,mic:'ok',bl:false,seen:'now',voice:'google'},{n:'Vihaan Gujjar',mk:'Redmi Note 9 Pro',v:'v89',h:'h27',on:false,mic:'ok',bl:false,seen:'21:30',voice:'google'},{n:'Kids phone',mk:'Motorola edge 50 pro',v:'v89',h:'h26',on:false,mic:'ok',bl:false,seen:'23:23',voice:'google'}],
   probs:[{id:'p1',s:'r',t:'TV mic asleep 12× today',d:'Remote mic sleeps when no button is pressed',f:'Ask: press OK',fx:'Asked the TV to show "press OK on 🎤"',st:0},{id:'p2',s:'r',t:'Motorola app 2 versions old (h26)',d:'screen v89 is fine, app can update',f:'Update now',fx:'Update sent - installs when no class runs',st:0},{id:'p3',s:'y',t:'TV voice did not start 4×',d:'engine com.google.android.tts',f:'Restart voice',fx:'Voice restarted on the TV',st:0},{id:'p4',s:'g',t:'Screen crash 22:55 - recovered',d:'renderer killed for memory',f:'OK',fx:'Marked seen',st:0}]},
  {id:'f2',name:'Vijaya family',key:'…8Q2M',tester:true,joined:'9 Nov',susp:false,deleted:false,last:'15:02',hear:64,rec:true,gh:false,tv:false,chan:'tester',
   kids:[{n:'Mangala',s:'8th',e:'🐰',st:12,wk:[],mis:'',sp:{},idle:0},{n:'Harsha',s:'4th',e:'🐻',st:5,wk:['6×7'],mis:'',sp:{},idle:2}],
   devs:[{n:'Harsha Gujjar',mk:'Samsung A14',v:'v89',h:'h28',on:true,mic:'NO PERMISSION',bl:false,seen:'15:02',voice:'google'},{n:"Mangala's phone",mk:'Vivo Y21',v:'v88',h:'h28',on:false,mic:'ok',bl:false,seen:'14:57',voice:'google'}],
   probs:[{id:'q1',s:'r',t:'Harsha Gujjar: microphone permission not given',d:'Android: Settings → Apps → Home Class → Permissions → Microphone',f:'Ask: allow mic',fx:'Asked the parent: "Please allow the microphone"',st:0},{id:'q2',s:'y',t:'Low hearing rate 64%',d:'Many "unsure" lines on one phone',f:'Save clips for tuning',fx:'Clips on for 7 days',st:0}]},
  {id:'f3',name:'Poorvika family',key:'…K1TD',tester:true,joined:'9 Nov',susp:false,deleted:false,last:'12:16',hear:72,rec:true,gh:false,tv:false,chan:'tester',
   kids:[{n:'Poorvika',s:'5th',e:'🦊',st:30,wk:['5×3','5×7'],mis:'5×3 lost as [unk] in a long recitation',sp:{},idle:0}],devs:[{n:"Poorvika's phone",mk:'Redmi 12',v:'v89',h:'h28',on:false,mic:'ok',bl:false,seen:'12:16',voice:'google'}],probs:[{id:'r1',s:'y',t:'Long recitation lost lines',d:'follow-along (v83) fixes this - phone has v89',f:'OK',fx:'Seen',st:0}]},
  {id:'f4',name:'Test family B',key:'…B7XA',tester:false,joined:'10 Nov',susp:false,deleted:false,last:'yesterday',hear:90,rec:false,gh:false,tv:false,chan:'stable',
   kids:[{n:'Sam',s:'3rd',e:'🐼',st:8,wk:[],mis:'',sp:{},idle:1}],devs:[{n:"Sam's phone",mk:'Realme C33',v:'v89',h:'h28',on:false,mic:'ok',bl:false,seen:'yesterday',voice:'google'}],probs:[]}],
 alerts:[{t:'20:10',m:'☁️ Gujjar family: TV mic asleep 12× - tried "press OK"',f:'f1',ft:'probs'},{t:'15:03',m:'☁️ Vijaya family: Harsha Gujjar has no microphone permission',f:'f2',ft:'probs'},{t:'09:10',m:'☁️ Nightly report ready',f:null}]}}
var S=fresh();
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2600)}
function modal(h){$('layer').insertAdjacentHTML('beforeend','<div class="modal" id="mdl"><div>'+h+'</div></div>')}
function closeM(){var m=$('mdl');m&&m.remove()}
function F(id){return S.fams.filter(function(f){return f.id==id})[0]}
function now(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function nProb(f){return f.probs.filter(function(p){return p.st==0&&p.s!='g'}).length}
function health(f){if(f.susp)return['⏸','y','paused'];var n=nProb(f);return n>1?['🔴','r',n+' problems']:n==1?['🟡','y','1 problem']:['✅','g','healthy']}
function reset(){S=fresh();render()}
/* ---------- nav ---------- */
function nav(){var t=[['fam','👪','Families'],['doc','🩺','Doctor'],['rel','🚀','Releases'],['al','🔔','Alerts'],['set','⚙️','Settings']];
 $('nav').innerHTML=t.map(function(x){return '<button class="'+(S.tab==x[0]&&!(S.fam&&x[0]!='fam')?'on':'')+'" data-a="tab:'+x[0]+'"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join('')}
function render(){nav();var h=S.fam?vFam():{fam:vList,doc:vDoc,rel:vRel,al:vAl,set:vSet}[S.tab]();$('wrap').innerHTML=h}
/* ---------- families list ---------- */
function vList(){var fs=S.fams.filter(function(f){return !f.deleted}).slice().sort(function(a,b){return nProb(b)-nProb(a)}),np=fs.reduce(function(a,f){return a+nProb(f)},0),nd=fs.reduce(function(a,f){return a+f.devs.length},0),on=fs.reduce(function(a,f){return a+f.devs.filter(function(d){return d.on}).length},0);
 var h='<h1>🛠️ HC Admin</h1><div class="mute">'+fs.length+' families · '+nd+' devices · '+on+' online now · '+AV.app+'</div><div class="kpi" style="margin-top:8px"><div><b>3</b><span>classes today</span></div><div><b>'+(np?'🔴 ':'')+np+'</b><span>problems</span></div><div><b>'+Math.round(fs.reduce(function(a,f){return a+f.hear},0)/fs.length)+'%</b><span>heard first time</span></div></div>';
 h+='<div class="tabs"><span class="'+(S.filter=='all'?'on':'')+'" data-a="flt:all">All</span><span class="'+(S.filter=='prob'?'on':'')+'" data-a="flt:prob">🔴 Problems</span><span class="'+(S.filter=='test'?'on':'')+'" data-a="flt:test">🧪 Testers</span><span class="'+(S.filter=='susp'?'on':'')+'" data-a="flt:susp">⏸ Paused</span></div>';
 fs.filter(function(f){return S.filter=='all'||(S.filter=='prob'&&nProb(f)>0)||(S.filter=='test'&&f.tester)||(S.filter=='susp'&&f.susp)}).forEach(function(f){var hl=health(f);
  h+='<div class="card" style="cursor:pointer" data-a="fopen:'+f.id+'"><div class="row"><div class="sp"><h2>'+f.name+'</h2><div class="mute">'+f.kids.map(function(k){return k.n}).join(' · ')+' · last class '+f.last+'</div></div><span class="chip '+hl[1]+'">'+hl[0]+' '+hl[2]+'</span></div><div style="margin-top:6px">'+f.devs.map(function(d){return '<span class="dot '+(d.on?'':'off')+'"></span> '+d.n.split(' ')[0]+' '+d.h+' '+d.v+' &nbsp;'}).join('')+'</div></div>'});
 var dl=S.fams.filter(function(f){return f.deleted});if(dl.length)h+='<div class="card" style="background:#fff4f4"><b>🗑 Deleted (restore within 30 days)</b>'+dl.map(function(f){return '<div class="row" style="margin-top:6px"><span class="sp">'+f.name+'</span><button class="fix" data-a="frest:'+f.id+'">Restore</button></div>'}).join('')+'</div>';
 return h+'<div class="note">Sorted: problems first. Tap a family. Families register themselves ENCRYPTED in DB3 <code>homeclass/hcreg-admin-family-list-encrypted-v1</code>. Data lives in DB3 now, DB6 later (one setting).</div>'}
/* ---------- family ---------- */
function vFam(){var f=F(S.fam),tabs=[['children','👦 Children'],['classes','📅 Classes'],['devices','📱 Devices'],['sound','🎙️ Sound'],['probs','🩺 Problems'],['live','👀 Live'],['log','🧾 Log'],['rep','🆘 Reports'],['ctl','🔐 Controls']];
 var h='<div class="row"><button class="fix" style="background:#eee;color:#222" data-a="fback:1">←</button><div class="sp"><h2>'+f.name+(f.susp?' ⏸':'')+'</h2><div class="mute">key '+f.key+' · joined '+f.joined+' · channel '+f.chan+'</div></div></div>';
 if(f.susp)h+='<div class="note" style="background:rgba(255,183,3,.25)">⏸ This family is paused: its apps show "Paused - contact Davan"; no classes, no alarms. Data is kept.</div>';
 h+='<div class="tabs">'+tabs.map(function(t){return '<span class="'+(S.ft==t[0]?'on':'')+'" data-a="ftab:'+t[0]+'">'+t[1]+(t[0]=='probs'&&nProb(f)?' ('+nProb(f)+')':'')+'</span>'}).join('')+'</div>';
 return h+({children:fKids,classes:fCls,devices:fDev,sound:fSnd,probs:fPro,live:fLive,log:fLog,rep:fRep,ctl:fCtl}[S.ft])(f)}
function fKids(f){return f.kids.map(function(k){return '<div class="card"><div class="row"><div style="font-size:30px">'+k.e+'</div><div class="sp"><b>'+k.n+'</b> · '+k.s+' std<div class="mute">⭐ '+k.st+' · weak: '+(k.wk.join(', ')||'none')+'</div></div>'+(k.idle>=3?'<span class="chip y">⚠️ idle '+k.idle+' days</span>':'')+'</div>'+(k.mis?'<div style="margin-top:6px"><span class="chip y">'+k.mis+'</span></div>':'')+(Object.keys(k.sp).length?'<div style="margin-top:6px"><b>✏️ Spelling</b> '+Object.keys(k.sp).map(function(w){return '<span class="chip '+(k.sp[w]=='✓'?'g':'r')+'">'+w+' '+k.sp[w]+'</span>'}).join('')+'</div>':'')+'</div>'}).join('')}
function fCls(f){return '<div class="card"><b>Sun 8 Nov · 22:46 · '+f.devs[0].n+' · Table of 10 test</b><div class="mute">right 5 · not heard 3 · time up 2</div><div class="tl"><div>10 × 9 · app said "10 9 ja?" · heard <b>"ninety"</b> ✓ · started after 4.5 s</div><div>10 × 4 · heard <b>"forty"</b> ✓ · 2.5 s</div><div class="u">10 × 10 · <b>time up</b> · 🔇 mic asleep</div><div>10 × 2 · after 🎤 Mic on · <b>"twenty"</b> ✓</div><div class="x">9 × 3 · heard <b>"twenty one"</b> ✗ (said 21) · <a href="#" data-a="play:1">▶ play</a></div><div class="s">9 × 6 · ⏭ skipped (not clean)</div></div></div><div class="note">Each question: what the app said, what it heard, ✓ / ✗ / not heard / skipped / time up, how long, ▶ the sound. Log keeps 90 days.</div>'}
function fDev(f){return f.devs.map(function(d,i){return '<div class="card"><div class="row"><span class="dot '+(d.bl?'bad':d.on?'':'off')+'"></span><div class="sp"><b>'+d.n+'</b><div class="mute">'+d.mk+' · screen '+d.v+' · app '+d.h+'</div><div class="mute">voice '+d.voice+' · mic '+(d.mic=='ok'?'🟢':'🔴 '+d.mic)+' · seen '+d.seen+'</div></div>'+(d.bl?'<span class="chip r">🚫 blocked</span>':'')+'</div><div class="row" style="gap:6px"><button class="btn soft" data-a="dtest:'+f.id+':'+i+'" style="margin:6px 0 0">🔔 Test</button><button class="btn '+(d.bl?'on':'soft')+'" data-a="dblock:'+f.id+':'+i+'" style="margin:6px 0 0">'+(d.bl?'✅ Unblock':'🚫 Block')+'</button><button class="btn soft" data-a="drm:'+f.id+':'+i+'" style="margin:6px 0 0">🗑</button></div></div>'}).join('')+'<div class="note">🚫 Block = the phone shows "This phone is switched off by Davan", stops listening and uploading. It can be unblocked any time.</div>'}
function fSnd(f){return '<div class="card"><b>🎙️ Saved recordings</b>'+(f.rec?'':'<div class="note">Voice clips are OFF for this family.</div>')+[['Table 9 · 45.8 s','heard: "nine one nine…" · 9 of 10 lines','Re-test with the app\'s own listening'],['Single answer 9×3 · 2 s','heard: "twenty one" → ✗ (said 21)','Re-test'],['Spell "bones" · 5 s','b o n e s ✓','Re-test']].map(function(r,i){return '<div class="prob"><span>▶</span><div class="sp"><b>'+r[0]+'</b><div class="mute">'+r[1]+'</div></div><button class="fix" data-a="retest:'+i+'">Re-test</button></div>'}).join('')+'</div><div id="rt"></div><div class="note">The same tools I use to check hearing (hc-rec.sh / hc-test.py): the saved WAV is run through the app\'s own grammar + judge. Clips are kept 30 days, then deleted by themselves.</div>'}
function fPro(f){return '<div class="card">'+(f.probs.length?f.probs.map(function(p){return '<div class="prob"><span>'+(p.st?'✅':p.s=='r'?'🔴':p.s=='y'?'🟡':'🟢')+'</span><div class="sp"><b>'+p.t+'</b><div class="mute">'+p.d+'</div>'+(p.st?'<div class="mute">✔ '+p.fx+' · '+p.at+'</div>':'')+'</div>'+(p.st?'':'<button class="fix '+(p.s=='g'?'g':'')+'" data-a="pfix:'+f.id+':'+p.id+'">'+p.f+'</button>')+'</div>'}).join(''):'<div class="mute">No problems 🎉</div>')+'</div><div class="note">Found by the hourly doctor (Doctor tab). Safe fixes run by themselves; the rest wait for your tap. A ☁️ alert reaches you only when it cannot fix it. Claude reads this same list first when you say "check the log".</div>'}
function fLive(f){var on=f.devs.filter(function(d){return d.on})[0];return on?'<div class="dark"><div class="row"><b class="sp">👀 Live · Vihaan · '+on.n+'</b><span class="chip r">● LIVE</span></div><div style="text-align:center;margin:10px 0"><div class="big" id="lq">9 × 7 = ?</div><div class="mute" id="lh">🎤 heard: "sixty…"</div></div><div class="row" style="gap:6px"><button class="btn red" data-a="lstop:1" style="margin:0">⏹ Stop</button><button class="btn soft" data-a="lskip:1" style="margin:0;background:#241f4d;color:#fff">⏭ Skip</button></div></div>':'<div class="card mute">No class is running now.</div>'}
function fLog(f){var L=['22:55  mic: no sound 1.5 s - reopened it ×42 (summary)','22:52  class end · right 8 wrong 1','22:46  heard 10x9: "ninety" → ✓','22:46  TV mic: window open 45 s','22:31  app h28 open · screen v89','22:30  voice engine ready · default google · installed: com.google.android.tts'];
 return '<div class="card"><div class="tabs"><span class="on">All devices</span><span>TV</span><span>Redmi</span><span>Errors only</span></div><pre id="logt">'+L.join('\n')+'</pre><button class="btn soft" data-a="copylog:1">📋 Copy</button><div class="mute">Per device, 1 day on the phone + 90 days here. Heartbeat every 5 min. One summary line instead of one per re-open (v76).</div></div>'}
function fRep(f){return '<div class="card"><b>🆘 Reports from this family</b>'+(f.id=='f2'?'<div class="prob"><span>🆘</span><div class="sp"><b>"The child I added is not taken"</b><div class="mute">Vijaya · 10:21 · voice note ▶ · log attached</div></div><button class="fix" data-a="rdone:1">Resolve</button></div>':'<div class="mute">None.</div>')+'</div>'}
function fCtl(f){var t=function(k,l,on){return '<div class="row" style="margin-top:6px"><span class="sp">'+l+'</span><button class="btn '+(on?'on':'off')+'" data-a="ftog:'+f.id+':'+k+'" style="width:auto;margin:0">'+(on?'✅ On':'Off')+'</button></div>'};
 return '<div class="card"><b>⏸ Stop this family</b><div class="mute">Their apps show "Paused - contact Davan". Nothing is deleted.</div><button class="btn '+(f.susp?'on':'off')+'" data-a="fsusp:'+f.id+'">'+(f.susp?'✅ Paused - tap to resume':'Pause this family')+'</button></div>'+
 '<div class="card"><b>🚀 Version</b><label class="f">Channel</label><select data-c="chan:'+f.id+'"><option value="tester" '+(f.chan=='tester'?'selected':'')+'>tester (gets new builds first)</option><option value="stable" '+(f.chan=='stable'?'selected':'')+'>stable (nightly release)</option></select><div class="mute">Screen '+S.rel.kid+' · app '+S.rel.apk+' · minimum allowed: screen '+S.rel.floor+' / app '+S.rel.floorApk+' (below = "Update needed", no class)</div></div>'+
 '<div class="card"><b>🎚️ Feature switches (in data, no new build)</b>'+t('rec','🎙️ Voice clips (consent)',f.rec)+t('gh','🔊 Google Home speaker',f.gh)+t('tv','📺 TV',f.tv)+'</div>'+
 '<div class="card"><b>🔑 Family key</b><div class="mute">Key '+f.key+'. If it leaked: make a new one; phones link again with the code.</div><button class="btn soft" data-a="krot:'+f.id+'">🔁 Rotate key</button></div>'+
 '<div class="card" style="border:2px solid rgba(255,77,109,.35)"><b>🗑 Delete</b><div class="mute">Nothing is deleted until you say yes. It shows exactly what goes.</div><button class="btn soft" data-a="dclips:'+f.id+'">🗑 Delete only voice clips + old logs</button><button class="btn red" data-a="fdel:'+f.id+'">🗑 Delete this whole family…</button></div>'}
/* ---------- doctor / releases / alerts / settings ---------- */
function vDoc(){var D=S.doc,R=[['mic','🎤 Mic asleep / no sound / no permission'],['voice','🔊 Voice silent / did not start'],['old','⬇️ Old screen or app version'],['crash','💥 Crash loop / screen rebuilt'],['hear','👂 Low hearing rate (under 70%)']],A=[['voice','Restart the voice by itself'],['update','Send the update by itself (never during a class)'],['micask','Ask the TV/parent: "press OK" / "allow mic"']];
 var h='<h1>🩺 Auto-doctor</h1><div class="mute">Runs every hour (like PC Doctor) · last run '+D.last+'</div><button class="btn" data-a="drun:1">▶ Run now</button><div class="card"><b>What it looks for</b>'+R.map(function(r){return '<div class="row" style="margin-top:6px"><span class="sp">'+r[1]+'</span><button class="btn '+(D.rules[r[0]]?'on':'off')+'" data-a="dr:'+r[0]+'" style="width:auto;margin:0">'+(D.rules[r[0]]?'✅ On':'Off')+'</button></div>'}).join('')+'</div><div class="card"><b>Safe fixes it does by itself</b>'+A.map(function(r){return '<div class="row" style="margin-top:6px"><span class="sp">'+r[1]+'</span><button class="btn '+(D.auto[r[0]]?'on':'off')+'" data-a="da:'+r[0]+'" style="width:auto;margin:0">'+(D.auto[r[0]]?'✅ On':'Off')+'</button></div>'}).join('')+'<div class="note">Fixes that delete or remove anything never run by themselves - they wait for your tap (same rule as PC Doctor).</div></div>';
 h+='<div class="card"><div class="row"><span class="sp"><b>☁️ Alert me only when it cannot fix</b></span><button class="btn '+(D.alerts?'on':'off')+'" data-a="dal:1" style="width:auto;margin:0">'+(D.alerts?'✅ On':'Off')+'</button></div></div>';
 return h+(S.drun?'<div class="card"><b>Last run '+S.drun+'</b><div class="mute">Checked 4 families · 9 devices · found 3 problems · fixed 1 by itself (TV voice restarted) · 2 wait for you</div></div>':'')}
function vRel(){var r=S.rel;return '<h1>🚀 Releases</h1><div class="card"><b>Kids screen</b> <span class="chip g">'+r.kid+' live</span><div class="mute">A screen change needs no new APK; every open app updates itself within a minute.</div><b>Android app (APK)</b> <span class="chip g">'+r.apk+' public</span> <span class="chip">next: '+r.next+'</span><div class="mute">Channel flow like the widgets: tester families first, then everyone at night.</div></div>'+
 '<div class="card"><b>🧪 Tester families</b><div class="mute">'+S.fams.filter(function(f){return f.chan=='tester'}).map(function(f){return f.name}).join(' · ')+'</div></div>'+
 '<div class="card"><b>⛔ Switches</b><div class="mute">'+(r.stop?'<span class="chip y">'+r.stop+'</span>':'Releasing normally tonight at 9:15 pm')+'</div><div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn soft" data-a="rs:Stopped for tonight" style="width:auto">Stop tonight</button><button class="btn soft" data-a="rs:Stopped until resume" style="width:auto">Stop until resume</button><button class="btn soft" data-a="rs:" style="width:auto">Resume</button><button class="btn" data-a="rnow:1" style="width:auto">Release now</button></div></div>'+
 '<div class="card"><b>🚧 Minimum version (kill floor)</b><div class="mute">Below this the app says "Update needed" and starts no class. Written with <code>_w: Date.now()</code> so an old cached copy cannot put an old value back.</div><div class="row"><input value="'+r.floor+'" id="fl1"><input value="'+r.floorApk+'" id="fl2"></div><button class="btn soft" data-a="rfloor:1">Save minimum</button></div>'+
 '<div class="card"><b>History</b><div class="mute">'+r.hist.join('<br>')+'</div></div>'}
function vAl(){return '<h1>🔔 Alerts</h1><div class="mute">Only what needs you. Tap one to open the family at that problem.</div>'+S.alerts.map(function(a,i){return '<div class="card" style="cursor:pointer" data-a="alopen:'+i+'"><div class="mute">'+a.t+'</div><b>'+a.m+'</b></div>'}).join('')+'<div class="note">Also arrives in the staff widget (Super Admin ☁️ alerts, 🏠 Home Class page): the tap opens this app at the family (link <code>admin#f=…&amp;t=probs</code>).</div>'}
function vSet(){var s=S.set;return '<h1>⚙️ Settings</h1><div class="card"><b>🔒 Admin key</b><div class="mute">Kept only on this phone, in this app\'s link. It is never inside the Home Class app. <br>Key: ••••••••••••••••</div><button class="btn soft" data-a="akey:1">Show / copy once</button></div>'+
 '<div class="card"><b>🧹 Clean-up (by itself)</b><div class="mute">Logs '+s.cleanLog+' days · class days '+s.cleanDays+' days · voice clips '+s.cleanClips+' days · deleted families after 30 days</div></div>'+
 '<div class="card"><b>📊 Free limits (DB3)</b><div class="bar" style="height:8px;background:#e6e6f2;border-radius:9px;overflow:hidden;margin:6px 0"><i style="display:block;width:7%;height:100%;background:#16b46c"></i></div><div class="mute">72 MB of 1 GB used · 4 families · warns at 70%. Per-family size limit 20 MB.</div></div>'+
 '<div class="card"><b>⏳ Expiry warnings</b><div class="mute">'+s.keyExp+'<br>APK signing key: no expiry<br>Warns the Super Admin 30 days before.</div></div>'+
 '<div class="card"><div class="row"><span class="sp"><b>🌙 Nightly report</b><div class="mute">Top problems, hearing rate, crashes, families gone quiet</div></div><button class="btn '+(s.nightly?'on':'off')+'" data-a="nn:1" style="width:auto;margin:0">'+(s.nightly?'✅ On':'Off')+'</button></div></div>'+
 '<div class="card"><b>📞 Support WhatsApp</b><div class="mute">'+s.wa+' (🆘 reports open it)</div></div><div class="note">Database: DB3 now, DB6 later - the address is one setting. This app has no connection to the college apps.</div>'}
/* ---------- actions ---------- */
document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t)return;var p=t.getAttribute('data-a').split(':'),a=p[0],x=p[1],y=p[2];if(t.tagName=='A')e.preventDefault();act(a,x,y,p.slice(1).join(':'))});
document.addEventListener('change',function(e){var c=e.target.getAttribute('data-c');if(!c)return;var p=c.split(':');if(p[0]=='chan'){F(p[1]).chan=e.target.value;toast('Channel: '+e.target.value)}});
function lg(f,m){f.last2=m}
function act(a,x,y,rest){var f=F(x)||F(S.fam);
 if(a=='frest'){F(x).deleted=false;toast('Restored '+F(x).name);render();return}
 if(a=='tab'){S.tab=x;S.fam=null;render();return}
 if(a=='flt'){S.filter=x;render();return}
 if(a=='fopen'){S.fam=x;S.ft='children';render();window.scrollTo(0,0);return}
 if(a=='fback'){S.fam=null;render();return}
 if(a=='ftab'){S.ft=x;render();return}
 if(a=='play'){toast('▶ Plays the saved sound: "twenty one"');return}
 if(a=='retest'){$('rt').innerHTML='<div class="card"><b>Re-test result</b><pre>app grammar + judge on the WAV\nheard: "'+['nine one nine … nine two eighteen','twenty one','b o n e s'][x]+'"\nverdict: '+(x==1?'✗ 21 (correct: app wrongly took 27 before v65, now ✗ 21)':'✓')+'</pre></div>';return}
 if(a=='pfix'){var p=f.probs.filter(function(q){return q.id==y})[0];p.st=1;p.at=now();toast('✔ '+p.fx);render();return}
 if(a=='dblock'){var d=f.devs[y];d.bl=!d.bl;if(d.bl)d.on=false;toast(d.bl?'🚫 '+d.n+' is switched off':'✅ '+d.n+' unblocked');render();return}
 if(a=='dtest'){toast('🔔 Test sent to '+f.devs[y].n+' - it says "Hello"');return}
 if(a=='drm'){var d=f.devs[y];modal('<b>🗑 Remove '+esc(d.n)+'?</b><div class="mute">Removes this phone from <b>'+f.name+'</b>. It keeps no child. Children and progress stay.</div><button class="btn red" data-a="drmyes:'+x+':'+y+'">Yes, remove</button><button class="btn soft" data-a="cm:1">Keep</button>');return}
 if(a=='drmyes'){f.devs.splice(+y,1);closeM();render();return}
 if(a=='cm'){closeM();return}
 if(a=='lstop'){toast('⏹ Stop sent to the TV (cmd stop)');return}if(a=='lskip'){toast('⏭ Skip sent');$('lq').textContent='9 × 8 = ?';$('lh').textContent='🎤 heard: …';return}
 if(a=='copylog'){try{navigator.clipboard.writeText($('logt').textContent)}catch(e){}toast('📋 Log copied');return}
 if(a=='rdone'){toast('Report resolved');return}
 if(a=='fsusp'){f.susp=!f.susp;toast(f.susp?'⏸ '+f.name+' paused - their apps show "Paused - contact Davan"':'▶ '+f.name+' resumed');render();return}
 if(a=='ftog'){f[y]=!f[y];render();return}
 if(a=='krot'){modal('<b>🔁 Rotate the key of '+f.name+'?</b><div class="mute">A new key is made and the old one stops working. Every phone must link again with the family code.</div><button class="btn red" data-a="krotyes:'+x+'">Yes, rotate</button><button class="btn soft" data-a="cm:1">Cancel</button>');return}
 if(a=='krotyes'){f.key='…'+Math.random().toString(36).slice(2,6).toUpperCase();closeM();toast('New key '+f.key);render();return}
 if(a=='dclips'){modal('<b>🗑 Delete voice clips + old logs of '+f.name+'</b><div class="mute">It will delete exactly:<br>• voice recordings (rec/, ans/): about 38 files, 14 MB<br>• device logs older than 7 days<br>It will NOT delete children, progress or settings.</div><button class="btn red" data-a="dclipsyes:'+x+'">Yes, delete these</button><button class="btn soft" data-a="cm:1">Cancel</button>');return}
 if(a=='dclipsyes'){closeM();toast('Deleted 38 clips + old logs (14 MB freed)');return}
 if(a=='fdel'){modal('<b>🗑 Delete the whole family "'+f.name+'"?</b><div class="mute">It will delete exactly:<br>• '+f.kids.length+' children ('+f.kids.map(function(k){return k.n}).join(', ')+') with all progress<br>• '+f.devs.length+' devices, all class days and logs, voice clips, reports<br>• the family key and code<br><b>Soft delete: kept 30 days, then removed by the clean-up. You can restore it until then.</b><br>Type the family name to confirm:</div><input id="dc" placeholder="'+esc(f.name)+'"><button class="btn red" data-a="fdelyes:'+x+'">Delete '+esc(f.name)+'</button><button class="btn soft" data-a="cm:1">Cancel</button>');return}
 if(a=='fdelyes'){if($('dc').value.trim()!=f.name){toast('Type the exact family name');return}f.deleted=true;closeM();S.fam=null;S.deletedId=x;toast('🗑 '+f.name+' moved to "deleted" - restore within 30 days');render();return}
 if(a=='drun'){S.drun=now();toast('🩺 Doctor ran');render();return}
 if(a=='dr'){S.doc.rules[x]=!S.doc.rules[x];render();return}if(a=='da'){S.doc.auto[x]=!S.doc.auto[x];render();return}if(a=='dal'){S.doc.alerts=!S.doc.alerts;render();return}
 if(a=='rs'){S.rel.stop=rest;toast(rest||'Resumed');render();return}
 if(a=='rnow'){S.rel.hist.unshift(now()+' release now: app '+S.rel.next+' → everyone');toast('🚀 Released now');render();return}
 if(a=='rfloor'){S.rel.floor=$('fl1').value;S.rel.floorApk=$('fl2').value;toast('Saved (with _w: Date.now())');return}
 if(a=='alopen'){var al=S.alerts[x];if(al.f){S.fam=al.f;S.ft=al.ft||'children';S.tab='fam'}render();return}
 if(a=='akey'){toast('🔑 Key copied (demo)');return}
 if(a=='nn'){S.set.nightly=!S.set.nightly;render();return}
}
render();
</script>
