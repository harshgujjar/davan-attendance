<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home Class V3 mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#eef0ff;--bg2:#fff4ea;--card:#fff;--ink:#22223b;--mute:#6b6b85;--line:#e6e6f2;--brand:#5b4bff;--good:#16b46c;--bad:#ff7a45;--live:#ff4d6d;--gold:#ffb703;--okbg:#dcf8ea;--okfg:#0b7a47;--nobg:#ffe8dc;--nofg:#b4461a;--lrbg:#ebe8ff;--lrfg:#3f31d6;--soft:rgba(91,75,255,.08);--shadow:0 10px 30px rgba(60,50,160,.12);--r:26px}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh}
h1,h2,h3,.big,.q{font-family:'Baloo 2',Nunito,system-ui,sans-serif;margin:0}h1{font-size:24px}h2{font-size:19px}
#bar{position:sticky;top:0;z-index:20;background:#14122b;color:#fff;padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font:800 12px Nunito}
#bar button,#bar select{border:0;border-radius:999px;padding:6px 10px;font:800 12px Nunito;background:#2b2760;color:#fff}
#bar button.on{background:var(--brand)}#bar label{display:flex;gap:4px;align-items:center}
#stage{max-width:480px;margin:0 auto;padding:10px 12px 70px}
#stage.tv{max-width:none;padding:10px 0 20px;display:flex;justify-content:center}
#dev{width:100%}
#dev.tv{width:960px;height:540px;transform-origin:top left;background:linear-gradient(160deg,var(--bg1),var(--bg2));border-radius:14px;overflow-y:auto;overflow-x:hidden;padding:12px 22px;font-size:20px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}.mute{color:var(--mute);font-size:13px}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--soft);font:800 12px Nunito;margin:3px 3px 0 0;color:var(--ink)}
.chip.g{background:rgba(22,180,108,.14);color:#0d7a48}.chip.r{background:rgba(255,77,109,.13);color:#c9184a}.chip.y{background:rgba(255,183,3,.2);color:#8a5a00}
.chip.plan{border:1.5px dashed #b9a300;background:#fffbe0;color:#7a6500}
.btn{border:0;border-radius:999px;padding:11px 16px;font:900 15px Nunito;background:var(--brand);color:#fff;width:100%;margin-top:8px;cursor:pointer}
.btn.soft{background:var(--soft);color:var(--brand)}.btn.good{background:var(--good)}.btn.red{background:var(--live)}.btn.off{background:#f3d36b;color:#5a4400}.btn.on{background:#1E7B3A;color:#fff}
.btn[disabled]{opacity:.45}
.pill{border:0;border-radius:999px;padding:6px 11px;font:800 12px Nunito;background:#fff;color:var(--brand);box-shadow:var(--shadow);cursor:pointer}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:#ffe0c2;flex:0 0 auto}.av.b{background:#d9e8ff}.av.g{background:#ffd9ec}
.map{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.map i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:800 12px Nunito;background:rgba(127,127,170,.13);color:var(--mute)}
.map i.m{background:var(--good);color:#fff}.map i.c{background:var(--brand);color:#fff;box-shadow:0 0 0 3px rgba(255,183,3,.6)}.map i.w{background:var(--bad);color:#fff}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--good);transition:width .3s}
.big{font-size:44px;line-height:1.05}.q{font-size:38px}
input,select,textarea{font:700 15px Nunito;padding:9px 11px;border-radius:12px;border:1.5px solid var(--line);width:100%;background:#fff;color:var(--ink);margin:4px 0}
label.f{display:block;font:800 12px Nunito;color:var(--mute);margin-top:6px}
.tabs{display:flex;gap:5px;overflow-x:auto;margin:8px 0}.tabs span{flex:0 0 auto;padding:6px 10px;border-radius:12px;background:#fff;font:800 12px Nunito;color:var(--mute);cursor:pointer}.tabs span.on{background:var(--ink);color:#fff}
.note{font-size:12px;color:var(--mute);background:rgba(255,183,3,.12);border-radius:12px;padding:8px 10px;margin:8px 0}
.demo{background:#14122b;color:#f3f1ff;border-radius:18px;padding:10px;margin:10px 0}.demo b{font-size:11px;letter-spacing:.5px;color:#ffb703}
.demo button{border:0;border-radius:12px;padding:8px 10px;margin:4px 4px 0 0;font:800 12px Nunito;background:#2b2760;color:#fff;cursor:pointer}
.flash{border-radius:18px;padding:12px;text-align:center;font:800 20px 'Baloo 2';margin:8px 0}.flash.ok{background:var(--okbg);color:var(--okfg)}.flash.no{background:var(--nobg);color:var(--nofg)}.flash.lr{background:var(--lrbg);color:var(--lrfg)}
.vtag{font:800 11px Nunito;color:var(--mute);background:var(--soft);padding:2px 7px;border-radius:8px;margin-left:6px}
.ring{animation:rg 1s infinite}@keyframes rg{50%{transform:scale(1.08)}}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#22223b;color:#fff;padding:10px 16px;border-radius:14px;font:800 13px Nunito;z-index:50;max-width:92%}
.modal{position:fixed;inset:0;background:rgba(20,18,43,.55);z-index:40;display:grid;place-items:center;padding:16px}.modal>div{background:#fff;border-radius:22px;padding:16px;max-width:420px;width:100%;max-height:88vh;overflow:auto}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys b{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px 0;text-align:center;font:800 22px 'Baloo 2';cursor:pointer}
.pin{display:flex;gap:10px;justify-content:center;margin:14px 0}.pin i{width:16px;height:16px;border-radius:50%;background:var(--line)}.pin i.f{background:var(--brand)}
.role{display:flex;gap:12px;align-items:center;padding:14px;border-radius:20px;background:#fff;box-shadow:var(--shadow);margin:10px 0;border:2px solid transparent;cursor:pointer}.role b{font:800 17px 'Baloo 2'}.role .e{font-size:34px}
.fx:focus{outline:4px solid var(--gold);outline-offset:2px}
.tv .btn{font-size:20px;padding:12px 18px}.tv .card{padding:12px;margin:8px 0}.tv .map i{width:34px;height:34px;font-size:16px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:45;font-size:34px;overflow:hidden}.conf i{position:absolute;top:-40px;font-style:normal;animation:fall 2.2s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.tv-sign{display:inline-block;padding:3px 10px;border-radius:999px;font:800 13px Nunito}.tv-sign.on{background:var(--okbg);color:var(--okfg)}.tv-sign.off{background:var(--nobg);color:var(--nofg)}
.sw{display:flex;gap:6px;align-items:center;margin-top:6px}.sw .btn{margin:0}
</style></head><body>
<div id="bar"></div>
<div id="stage"><div id="dev"><div id="app"></div></div></div>
<div id="demoOut" style="max-width:480px;margin:0 auto;padding:0 12px 40px"></div><div id="layer"></div>
<script>
/* ============ DATA (real names, versions and values from the built app: screen v89 · core v42 · kids app h28 · parent v58 · p3 · DB3) ============ */
var PRAISE=['Correct!','Super!','Well done!','Excellent!','Great job!','Yes! Right!','Fantastic!','Brilliant!'];
var VER={kid:'v89',app:'h28',par:'v58',pApp:'p3'};
function fresh(){return{
 role:'parent',scr:'home',stack:[],bday:false,sound:false,
 fam:{name:'Gujjar',code:'482913',pauseAll:false,joiner:'za',ans:20,hands:true,clips:true,spk:'auto',speed:'1',pin:'1234',unlocked:false,wa:'9844542132'},
 kids:[
  {id:'k1',name:'Vihaan',say:'Vee-haan',std:'2nd',g:'b',dob:'2018-03-12',from:1,to:10,style:'learn',min:15,time:'18:00',days:'Mon–Sat',emoji:'🦁',dev:'d1',on:true,learnt:[1,2,3,4,5,6,7,8],cur:9,stars:46,weak:{'9×7':2,'9×8':1},today:{min:18,right:31,wrong:4,nh:3}},
  {id:'k2',name:'Aryan',say:'Aah-ree-an',std:'7th',g:'b',dob:'2013-06-20',from:11,to:30,style:'revise',min:15,time:'18:30',days:'Mon–Sat',emoji:'🐯',dev:'d2',on:true,learnt:[],cur:0,stars:120,weak:{'17×8':3},today:{min:0,right:0,wrong:0,nh:0}}],
 devs:[
  {id:'d1',name:"Vihaan's phone",kind:'phone',make:'Redmi Note 9 Pro',v:'v89',h:'h27',voice:'ok · com.google.android.tts',mic:true,seen:'21:30',on:true},
  {id:'d2',name:'Kids phone',kind:'phone',make:'Motorola edge 50 pro',v:'v89',h:'h26',voice:'ok · com.google.android.tts',mic:true,seen:'23:23',on:false},
  {id:'d3',name:'Living room TV',kind:'tv',make:'Sony BRAVIA (Google TV)',v:'v89',h:'h28',voice:'ok',mic:true,seen:'now',on:true}],
 live:null,log:[],upd:null,pause:false};}
var S=fresh(),C=null,R=null,Z=null,TM=null;
function $(id){return document.getElementById(id)}
function kid(id){return S.kids.filter(function(k){return k.id==id})[0]}
function dev(id){return S.devs.filter(function(d){return d.id==id})[0]||{id:'',name:'(no phone linked)',kind:'phone',make:'-',v:'-',h:'-',voice:'-',mic:false,seen:'-',on:false}}
function now(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2)}
function dlog(m){S.log.unshift(now()+' '+m);S.log=S.log.slice(0,60)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2600)}
function speak(t,force){if(!(S.sound||force)||!window.speechSynthesis)return;try{var u=new SpeechSynthesisUtterance(t);u.lang='en-IN';u.rate=+S.fam.speed||1;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function confetti(){var l=$('layer'),h='<div class="conf">';for(var i=0;i<28;i++)h+='<i style="left:'+(Math.random()*96)+'%;animation-delay:'+(Math.random()*.8)+'s">'+['🎉','⭐','✨','🎊'][i%4]+'</i>';l.insertAdjacentHTML('beforeend',h+'</div>');setTimeout(function(){var c=l.querySelector('.conf');c&&c.remove()},3200)}
function modal(h){$('layer').insertAdjacentHTML('beforeend','<div class="modal" id="mdl"><div>'+h+'</div></div>')}
function closeM(){var m=$('mdl');m&&m.remove()}
function isTV(){return S.role=='tv'}
function myKids(){if(S.role=='kids'){var m=S.kids.filter(function(k){return k.dev=='d1'});return m.length?m:S.kids}return S.kids}
function age(k){return 2026-(+k.dob.slice(0,4))}
function nextClass(k){return k.on&&!S.fam.pauseAll?'next class '+k.time.replace(/^18:00$/,'6:00 pm').replace(/^18:30$/,'6:30 pm'):'⏸ no class (paused)'}
function mapHTML(k,st){var h='<div class="map">';for(var i=1;i<=10;i++){var c='';if(st){c=st[i]==2?'m':st[i]==4?'w':(C&&C.cur==i)?'c':''}else{c=k.learnt.indexOf(i)>=0?'m':(i==k.cur?'c':'')}h+='<i class="'+c+'">'+i+'</i>'}return h+'</div>'}
function vtag(){return '<span class="vtag">'+(S.role=='parent'?VER.par+' · '+VER.pApp:VER.kid+' · '+VER.app)+'</span>'}

/* ============ TOP PREVIEW BAR (mockup only, not part of the app) ============ */
function bar(){var r=[['parent','👨‍👩‍👧 Parent phone'],['kids',"🧒 Vihaan's phone"],['shared','🏠 Shared phone'],['tv','📺 TV']],h='<b>👁 PREVIEW AS</b>';
 r.forEach(function(x){h+='<button class="'+(S.role==x[0]?'on':'')+'" data-a="role:'+x[0]+'">'+x[1]+'</button>'});
 h+='<select data-c="jump"><option value="">Jump to…</option><option value="first">First run (new family)</option><option value="home">Home</option><option value="class">Class (table 9)</option><option value="recite">Say the whole table</option><option value="spell">Evs spelling</option><option value="practise">Practise a table</option><option value="lessons">Lessons</option><option value="settings">⚙️ Settings</option><option value="devices">📱 Devices + code</option><option value="widgets">🧩 Widgets + alerts (planned)</option><option value="done">Class finished</option></select>';
 h+='<label><input type="checkbox" data-c="snd"'+(S.sound?' checked':'')+' style="width:auto"> 🔊 demo voice</label><label><input type="checkbox" data-c="bd"'+(S.bday?' checked':'')+' style="width:auto"> 🎂 birthday today</label><button data-a="upd:go">🆕 new version arrives</button><button data-a="reset:1">↺ Reset</button>';
 $('bar').innerHTML=h}

/* ============ ROUTER ============ */
function go(s,push){if(push!==false&&S.scr!=s)S.stack.push(S.scr);S.scr=s;render()}
function back(){S.scr=S.stack.pop()||'home';if(S.scr=='class'&&!C)S.scr='home';render()}
function render(){
 var st=$('stage'),dv=$('dev');st.className=isTV()?'tv':'';dv.className=isTV()?'tv':'';
 if(isTV()){var sc=Math.min(1,(window.innerWidth-16)/960);dv.style.transform='scale('+sc+')';dv.style.marginBottom=(-(540*(1-sc)))+'px';dv.style.width='960px'}else{dv.style.transform='';dv.style.marginBottom='';dv.style.width=''}
 var f={first:vFirst,home:vHome,class:vClass,recite:vRecite,spell:vSpell,practise:vPractise,lessons:vLessons,settings:vSettings,devices:vDevices,widgets:vWidgets,done:vDone,pin:vPin,watch:vWatch,report:vReport,kform:vKform,who:vWho}[S.scr]||vHome;
 $("app").innerHTML=topbar()+f()+updCard();bar();
 var dm=$('demoOut');dm.innerHTML='';if(isTV()){[].slice.call($('app').querySelectorAll('.demo')).forEach(function(n){dm.appendChild(n)})}
 if(isTV()){var a=$('app').querySelector('.fx');if(a&&!document.activeElement.classList.contains('fx'))a.focus()}
}
function topbar(){
 var h='<div class="row" style="margin-bottom:4px">';
 if(S.scr!='home'&&S.scr!='first'){h+='<button class="pill fx" data-a="back:1">←</button>'}
 var fam=S.fam.name+' family',t=S.role=='parent'?'Parents':'Home Class';
 h+='<div class="sp"><h1 style="font-size:'+(isTV()?30:21)+'px">'+t+vtag()+'</h1><div class="mute">'+fam+' · '+new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+'</div></div>';
 h+='<button class="pill fx" data-a="refresh:1">🔄 Refresh</button><button class="pill fx" data-a="go:report">🆘 Help</button><button class="pill fx" data-a="go:settings">⚙️ Settings</button>';
 if(S.role=='shared')h+='<button class="pill fx" data-a="go:pin">🔒</button>';
 return h+'</div>'}
function updCard(){if(!S.upd)return '';var u=S.upd;return '<div class="card" style="background:#fff7e0"><div class="row"><b class="sp">🆕 '+(u.p<100?'Updating… '+u.p+'%':'Updated to v90 · h29 ✓')+'</b><button class="pill fx" data-a="upd:close">✕</button></div><div class="mute">'+u.n+'</div><div class="bar" style="margin-top:6px"><i style="width:'+u.p+'%"></i></div></div>'}

/* ============ FIRST RUN: roles, new family, link with code ============ */
function vFirst(){var s=S.first||(S.first={step:'role'});
 if(s.step=='role')return '<div class="card" style="text-align:center"><div style="font-size:44px">🎓</div><h1>Home Class</h1><div class="mute">Tables, spellings and lessons - spoken, not typed</div></div><h2 style="margin:12px 4px 0">Who uses this phone?</h2>'+
  [['parent','👨‍👩‍👧','Parent','Set up children, watch live, ▶ Start, 📣 Call'],['kids','🧒','Child','Only the class - rings at class time'],['shared','🏠','Shared phone','Children use it; the parent part is behind a 🔒 PIN'],['tv','📺','TV','Picked by itself on a TV - big board, remote mic']].map(function(r){return '<div class="role fx" tabindex="0" data-a="firstrole:'+r[0]+'"><span class="e">'+r[1]+'</span><div><b>'+r[2]+'</b><div class="mute">'+r[3]+'</div></div></div>'}).join('')+'<div class="note">Changeable later in ⚙️. A TV never shows this screen.</div>';
 if(s.step=='fam')return '<div class="card"><h2>🏠 Start a new family</h2><label class="f">Family name</label><input id="fn" placeholder="e.g. Vijaya"><button class="btn fx" data-a="firstfam:1">Start →</button><button class="btn soft fx" data-a="first:link">I have a family code</button><div class="note">A new family starts with NO children and voice clips ON while testing (v77/v78). The app name becomes "&lt;Family&gt; Home Class".</div></div>';
 if(s.step=='link')return '<div class="card"><h2>📲 Link with the family code</h2><div class="mute">The 6-digit code is on the parent phone: Home (until the first child) and ⚙️ Settings → Devices.</div><input id="lc" inputmode="numeric" maxlength="6" placeholder="482913"><button class="btn fx" data-a="firstlink:1">Link this phone</button></div>';
 return ''}

/* ============ KIDS HOME / PARENT HOME ============ */
function vHome(){
 if(S.role=='parent')return pHome();
 var ks=myKids(),h='';
 if(S.fam.pauseAll)h+='<div class="note">⏸ Classes are paused by your parents (no class, no alarm).</div>';
 h+='<div class="row"><div class="sp"><h1 style="font-size:'+(isTV()?34:26)+'px">Good evening! 🌙</h1></div><span class="chip">⭐ '+ks.reduce(function(a,k){return a+k.stars},0)+'</span></div>';
 ks.forEach(function(k){h+=kCard(k)});
 if(S.role=='kids'&&ks.length<S.kids.length)h+='<div class="note">Other children are on other phones - see ⚙️ Settings → "Other children (on other phones)".</div>';
 if(isTV())h+='<div class="note">📺 TV: ▶ Start class runs ON the TV; the remote OK / arrows reach every button. <span class="tv-sign '+(S.tvMic===false?'off':'on')+'">'+(S.tvMic===false?'🔇 Mic OFF - press OK on 🎤':'🎤 Mic ON')+'</span></div>';
 return h+h2()}
function h2(){return '<div class="demo"><b>ℹ️ WHAT IS PLANNED (not built yet)</b><div style="margin-top:4px"><span class="chip plan">🔥 streak</span><span class="chip plan">🏅 badges</span><span class="chip plan">🦁 buddy</span><span class="chip plan">📒 sticker book</span><span class="chip plan">📅 Sunday summary</span><span class="chip plan">🧓 grandparents</span><span class="chip plan">👨‍👩‍👧‍👦 family quiz</span></div></div>'}
function kCard(k){
 var bd=S.bday&&k.id=='k1';
 return '<div class="card"><div class="row"><div class="av '+(k.id=='k2'?'b':'')+'">'+k.emoji+'</div><div class="sp"><h2>'+k.name+'</h2><div class="mute">'+k.std+' std · '+nextClass(k)+'</div></div>'+(bd?'<span class="chip y">🎂 Happy birthday!</span>':'')+'<span class="chip plan">🔥 5 days</span></div>'+mapHTML(k)+
  '<button class="btn fx" data-a="start:'+k.id+'"'+(S.fam.pauseAll?' disabled':'')+'>▶ Start class</button>'+
  '<div class="row" style="gap:6px"><button class="btn soft fx" data-a="kgo:practise:'+k.id+'">📚 Practise a table</button><button class="btn soft fx" data-a="kgo:lessons:'+k.id+'">✏️ Evs / lessons</button></div></div>'}
function pHome(){
 var h='',nk=S.kids.length;
 if(!nk)h+='<div class="card" style="background:#eef0ff"><b>📲 Link a kids phone</b><div class="big" style="font-size:34px;letter-spacing:4px">'+S.fam.code+'</div><div class="mute">Enter this code on the kids phone or the TV · <button class="pill fx" data-a="newcode:1">🔁 New code</button></div></div>';
 h+='<div class="card"><b>📅 Classes for all children</b><div class="sw"><button class="btn '+(S.fam.pauseAll?'off':'on')+' fx" data-a="pause:1">'+(S.fam.pauseAll?'▶ Turn classes on':'✅ Classes ON · ⏸ Turn all off')+'</button></div></div>';
 S.kids.forEach(function(k){var lv=S.live&&S.live.kid==k.id;
  h+='<div class="card"><div class="row"><div class="av '+(k.id=='k2'?'b':'')+'">'+k.emoji+'</div><div class="sp"><b>'+k.name+'</b> · '+k.std+'<div class="mute">Today '+k.today.min+' min · '+k.today.right+' right · '+k.today.wrong+' wrong · '+k.today.nh+' not heard</div></div>'+(lv?'<span class="chip r">● LIVE</span>':'<span class="chip">'+nextClass(k)+'</span>')+'</div>'+mapHTML(k)+
  '<div class="mute" style="margin-top:6px">Weak: '+(Object.keys(k.weak).join(', ')||'none')+' · phone: '+dev(k.dev).name+'</div>'+
  '<div class="row" style="gap:6px"><button class="btn fx" data-a="'+(lv?'watch:'+k.id:'startp:'+k.id)+'">'+(lv?'👀 Watch live':'▶ Start now')+'</button><button class="btn soft fx" data-a="call:'+k.id+'">📣 Call</button></div></div>'});
 h+='<div class="card"><b>📱 Kids devices</b>';S.devs.forEach(function(d){h+='<div class="row" style="margin-top:6px"><span>'+(d.kind=='tv'?'📺':'📱')+'</span><div class="sp"><b>'+d.name+'</b><div class="mute">'+d.make+' · '+d.v+' / '+d.h+' · seen '+d.seen+'</div></div><span class="chip '+(d.on?'g':'')+'">'+(d.on?'online':'offline')+'</span></div>'});
 h+=nk?'<div class="mute" style="margin-top:8px">📲 Family code '+S.fam.code+' - to add more phones or a TV, see ⚙️ Settings → Devices</div>':'';

 h+='<div class="card"><b>📱 Devices</b>';S.devs.forEach(function(d){h+='<div class="card" style="margin:8px 0;background:#fafaff"><div class="row"><span style="font-size:24px">'+(d.kind=='tv'?'📺':'📱')+'</span><div class="sp"><b>'+esc(d.name)+'</b><div class="mute">'+d.make+' · screen '+d.v+' · app '+d.h+(d.h!='h28'?' <span class="chip y">app update waits</span>':'')+'</div><div class="mute">voice '+d.voice+' · mic '+(d.mic?'🟢':'🔴 no permission')+' · seen '+d.seen+'</div></div><span class="chip '+(d.on?'g':'')+'">'+(d.on?'online':'off')+'</span></div><div class="row" style="gap:6px"><button class="btn soft fx" data-a="dren:'+d.id+'" style="margin:6px 0 0">✏️ Name</button><button class="btn soft fx" data-a="dtest:'+d.id+'" style="margin:6px 0 0">🔔 Test</button><button class="btn soft fx" data-a="drm:'+d.id+'" style="margin:6px 0 0">🗑 Remove</button></div></div>'});
 return h+'</div>'}

/* ============ WATCH LIVE / PIN / REPORT / WIDGETS ============ */
function vWatch(){var l=S.live;if(!l)return '<div class="card">No class is running now.<button class="btn fx" data-a="go:home">Back</button></div>';var k=kid(l.kid);
 return '<div class="card" style="background:#14122b;color:#f3f1ff"><div class="row"><b class="sp">👀 Live · '+k.name+' · '+dev(k.dev).name+'</b><span class="chip r">● LIVE</span></div><div style="text-align:center;margin:12px 0"><div class="big">9 × '+(l.line||'…')+' = ?</div><div class="mute" style="color:#a9a4d6">🎤 heard: '+(l.hear||'…')+'</div><div>✓ '+l.right+' · ✗ '+l.wrong+'</div></div><div class="row" style="gap:6px"><button class="btn red fx" data-a="stopc:1">⏹ Stop</button><button class="btn soft fx" data-a="ans:skip" style="background:#241f4d;color:#fff">⏭ Skip</button></div></div><div class="note">Updates as the child answers (switch to "Vihaan\'s phone" above, run a class, come back).</div>'}
function vPin(){var p=S.pinIn||'';return '<div class="card" style="text-align:center"><div style="font-size:40px">🔒</div><h2>Parent area</h2><div class="mute">Enter your PIN (1234 in this demo)</div><div class="pin">'+[0,1,2,3].map(function(i){return '<i class="'+(i<p.length?'f':'')+'"></i>'}).join('')+'</div><div class="keys">'+[1,2,3,4,5,6,7,8,9,'✕',0,'⌫'].map(function(n){return '<b class="fx" tabindex="0" data-a="pin:'+n+'">'+n+'</b>'}).join('')+'</div><div class="mute" style="margin-top:10px">Forgot the PIN? Ask Davan support - there is no login by design.</div></div>'}
function vReport(){return '<div class="card"><h2>🆘 Report a problem</h2><label class="f">What happened?</label><textarea id="rn" rows="3" placeholder="e.g. it did not hear 9 × 7"></textarea><div class="row" style="gap:6px"><button class="btn soft fx" data-a="rvoice:1">🎙️ Record a voice note</button></div><div class="mute" id="rv"></div><div class="mute">Sends: your note, the voice note and this phone\'s log to the admin page, and opens WhatsApp '+S.fam.wa+'.</div><button class="btn good fx" data-a="rsend:1">Send</button></div>'}
function vWidgets(){return '<div class="note">🧩 PLANNED. Home-screen widgets and alerts for Home Class V2. Tap a widget to see what it opens. The data comes from DB3 (later DB6), so a data change never needs a new build.</div>'+
 '<div class="card" style="background:#14122b;color:#fff"><b>🧒 Kids widget (home screen)</b><div class="row" style="margin-top:8px"><div class="av">🦁</div><div class="sp"><b>Vihaan</b><div class="mute" style="color:#a9a4d6">Next class 6:00 pm · table 9 · 8 of 10</div></div><button class="pill fx" data-a="wopen:kids">▶ Start</button></div></div>'+
 '<div class="card" style="background:#14122b;color:#fff"><b>👨‍👩‍👧 Parent widget</b><div class="mute" style="color:#a9a4d6">🦁 Vihaan 18 min · 31 ✓ · 4 ✗ · <span style="color:#ff8da0">● LIVE</span><br>🐯 Aryan no class today · ⚠️ phone offline 2 days</div><div class="row" style="gap:6px;margin-top:6px"><button class="pill fx" data-a="wopen:parent">👀 Watch</button><button class="pill fx" data-a="call:k1">📣 Call</button></div></div>'+
 '<div class="card"><b>🔔 Alerts (✨ = written by AI, never the app\'s own texts)</b><div class="mute" style="margin-top:6px">🏠 "Vihaan, class time! Say ready" - child phone, rings 10 min<br>📲 "Vihaan learnt the 9 table 🎉" - parents<br>⚠️ "Kids phone: no class for 5 days" - parents<br>☁️ "Family Vijaya: TV mic asleep 12×" - Super Admin, tap opens the admin app at that family</div></div>'+
 '<div class="note">Staff widget (Super Admin page 🏠 Home Class): families with problems + last alerts, link taps open the admin app. Like the college widgets: staged release (test list first), Google Home options the same everywhere, auto-update, no manual step.</div>'}

/* ============ ACTIONS ============ */
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-a]');if(!t)return;var p=t.getAttribute('data-a').split(':'),a=p[0],x=p[1],y=p[2];act(a,x,y,t)});
document.addEventListener('change',function(e){var t=e.target,c=t.getAttribute('data-c');if(!c)return;
 if(c=='jump'){jump(t.value);t.value='';return}if(c=='snd'){S.sound=t.checked;return}if(c=='bd'){S.bday=t.checked;render();return}
 if(c=='ans'){S.fam.ans=+t.value;toast('Time to answer: '+(t.value=='0'?'Off':t.value+' s'));return}
 if(c=='fname'){S.fam.name=t.value||'Gujjar';render()}});
function jump(v){if(!v)return;S.stack=[];S.first=null;
 if(v=='first'){S.role='parent';S.first={step:'role'};S.scr='first';render();return}
 if(v=='class'){if(S.role=='parent')S.role='kids';startClass('k1','demo');C.phase='ask';nextQ();return}
 if(v=='recite'){R=null;S.role=S.role=='parent'?'kids':S.role}if(v=='spell'){Z=null;S.role=S.role=='parent'?'kids':S.role}
 if(v=='practise'||v=='lessons'){S.role=S.role=='parent'?'kids':S.role}
 if(v=='done'){C={k:S.kids[0],right:5,phase:'done'}}
 S.scr=v;render()}
function act(a,x,y,t){
 if(/^(call|hear|krm|watch|start|startp|kform|whopick)$/.test(a)&&x&&x!='new'&&!kid(x)){toast('That child was removed');S.scr='home';render();return}
 if(a=='role'){S.role=x;if(S.scr=='first')S.scr='home';S.stack=[];render();return}
 if(a=='go'){go(x);return}if(a=='back'){back();return}if(a=='gohome'){S.stack=[];go('home',false);return}
 if(a=='reset'){if(x=='1'){clearInterval(TM);S=fresh();C=R=Z=null;S.scr='home';render()}else if(x=='r'){R=null;render()}else{Z=null;render()}return}
 if(a=='refresh'){toast('🔄 Cleared the page caches - loaded the newest copy');render();return}
 if(a=='firstrole'){S.role=x;S.first.step=x=='parent'?'fam':'link';if(x=='tv'){S.scr='home'}render();return}
 if(a=='first'){S.first.step=x;render();return}
 if(a=='firstfam'){var n=$('fn').value.trim();if(!n){toast('Type the family name first');return}S.fam.name=n;S.kids=[];S.devs=[];S.fam.code=String(Math.floor(100000+Math.random()*899999));S.scr='home';S.stack=[];dlog('family started '+n);render();return}
 if(a=='firstlink'){var c=$('lc').value;if(c.length!=6){toast('The code has 6 digits');return}S.scr='who';render();return}
 if(a=='start'||a=='startp'){S.role=a=='startp'?'kids':S.role;startClass(x,a=='startp'?'parent ▶ Start now':'Start');return}
 if(a=='ready'){C.phase='ask';nextQ();return}
 if(a=='ans'){ans(x);return}
 if(a=='stopc'){clearInterval(TM);dlog('class stopped');C=null;S.live=null;S.scr='home';S.stack=[];render();return}
 if(a=='micon'){S.tvMic=true;toast('🎤 Mic on');render();return}
 if(a=='tvsleep'){S.tvMic=false;dlog('TV mic: no sound - remote sleeps');render();return}
 if(a=='hold'){toast('✋ Listening only while you hold (only his voice)');return}
 if(a=='typeq'){modal('<b>⌨️ Type the answer</b><input id="ta" inputmode="numeric" placeholder="63"><button class="btn fx" data-a="typeok:1">OK</button>');return}
 if(a=='typeok'){var v=+$('ta').value;closeM();ans(v==9*C.cur?'ok':'bad');return}
 if(a=='watch'){go('watch');return}
 if(a=='call'){var k=kid(x);modal('<b>📣 Call '+k.name+' to class</b><div class="mute">It calls ONE named phone:</div>'+S.devs.filter(function(d){return d.kind!='tv'}).map(function(d){return '<button class="btn soft fx" data-a="callgo:'+d.id+':'+x+'" style="text-align:left">📱 '+d.name+'<div class="mute">'+d.make+' · '+(d.on?'online':'offline')+'</div></button>'}).join('')+'<button class="btn soft" data-a="closem:1">Cancel</button>');return}
 if(a=='callgo'){closeM();var d=dev(x);toast(d.on?'📣 Calling on '+d.name+'…':'⚠️ '+d.name+' is offline - not called');dlog('call '+d.name);return}
 if(a=='closem'){closeM();return}
 if(a=='kgo'){S.pk=y;go(x);return}
 if(a=='ptab'){toast('Table '+x+' chosen');return}
 if(a=='pmode'){toast('Practising 9 · '+x+' mode (demo)');return}
 if(a=='rec'){if(!R)R={n:2,res:{},cur:2};R.res[R.cur]=x==1?1:2;R.cur++;dlog('follow 9×'+(R.cur-1)+' '+(x==1?'✓':'not heard'));render();return}
 if(a=='sp'){if(!Z)Z={w:'MUSCLES',got:'',tr:''};var n=Z.got.length;if(x=='ok'){Z.got+=Z.w[n];Z.tr='heard: "'+Z.w[n].toLowerCase()+'" → ✓'}else if(x=='es'){Z.got+=Z.w[n];Z.tr='heard "es" → understood as S ✓'}else{Z.tr='heard "x" → ✗ say the letter again'}render();return}
 if(a=='lesson'){toast('Oral lesson starts (demo)');return}
 if(a=='pause'){S.fam.pauseAll=!S.fam.pauseAll;dlog('pauseAll '+S.fam.pauseAll);render();return}
 if(a=='join'){if(x=='test'){speak('Seven eight za fifty six. Seven eight ja fifty six',true);toast('🔊 Plays on THIS phone (parent app voice)');return}S.fam.joiner=x;render();return}
 if(a=='tog'){S.fam[x]=!S.fam[x];render();return}
 if(a=='spk'){S.fam.spk=x;render();return}if(a=='spd'){S.fam.speed=x;speak('Seven eight za fifty six',true);render();return}
 if(a=='hear'){var k=kid(x);speak(k.name+', class time!',true);toast('🔊 "'+k.say+'" - on this phone');return}
 if(a=='hearf'){speak($('ksay').value||'name',true);return}
 if(a=='kform'){S.kf=x;go('kform');return}
 if(a=='kg'){S.kg=x;var k=S.kf=='new'?null:kid(S.kf);if(k)k.g=x;S.kg2=x;document.querySelectorAll('[data-a^="kg:"]').forEach(function(b){var on=b.getAttribute('data-a')=='kg:'+x;b.className='btn '+(on?'on':'soft')+' fx'});return}
 if(a=='ksave'){var nm=$('kn').value.trim(),sd=$('ks').value,dob=$('kd').value;var gg=S.kf=='new'?S.kg2:kid(S.kf).g;
  if(!nm){toast('Name is required');return}if(!sd){toast('Class must be chosen (no preset)');return}if(!gg){toast('Boy or girl is required');return}if(!dob){toast('Date of birth is required');return}if(dob>'2025-11-14'){toast('Date of birth must be at least a year ago');return}
  var o={name:nm,std:sd,g:gg,dob:dob,say:$('ksay').value||nm,from:+$('kf').value,to:+$('kt').value,style:$('kst').value,dev:$('kdev').value};
  if(S.kf=='new'){var id='k'+(S.kids.length+1)+Date.now()%1000;S.kids.push(Object.assign({id:id,min:15,time:'18:00',days:'Mon–Sat',emoji:gg=='g'?'🐰':'🐻',on:true,learnt:[],cur:o.from,stars:0,weak:{},today:{min:0,right:0,wrong:0,nh:0}},o));if(!S.devs.length)S.devs.push({id:'d1',name:nm+"'s phone",kind:'phone',make:'This phone',v:'v89',h:'h28',voice:'ok',mic:true,seen:'now',on:true});toast('✓ '+nm+' saved - this phone is now '+nm+"'s class phone");dlog('child added '+nm)}
  else{Object.assign(kid(S.kf),o);toast('✓ Saved (only changed fields written)');dlog('child saved '+nm)}
  S.kg2=null;S.stack=[];S.scr=S.role=='parent'?'settings':'home';render();return}
 if(a=='krm'){var k=kid(x);modal('<b>🗑 Remove '+k.name+'?</b><div class="mute">This deletes: '+k.name+'\'s settings, progress (tables, weak facts), '+k.stars+' ⭐, day totals and answer logs for this child.<br><b>Nothing else changes.</b> You cannot undo it.</div><button class="btn red fx" data-a="krmyes:'+x+'">Yes, remove '+k.name+'</button><button class="btn soft" data-a="closem:1">Keep</button>');return}
 if(a=='krmyes'){S.kids=S.kids.filter(function(k){return k.id!=x});closeM();toast('Removed (the child is deleted from cfg/kids only)');render();return}
 if(a=='whopick'){var k=kid(x);k.dev='d1';S.role='kids';toast('✓ This phone is now '+k.name+"'s class phone");gohome();return}
 if(a=='newcode'){modal('<b>🔁 New code?</b><div class="mute">Makes a fresh 6-digit code and deletes the old one. Phones already linked stay linked.</div><button class="btn fx" data-a="newcodeyes:1">Make a new code</button><button class="btn soft" data-a="closem:1">Cancel</button>');return}
 if(a=='newcodeyes'){S.fam.code=String(Math.floor(100000+Math.random()*899999));closeM();dlog('new family code');render();return}
 if(a=='dren'){modal('<b>✏️ Name this phone</b><input id="dn" value="'+esc(dev(x).name)+'"><button class="btn fx" data-a="drenok:'+x+'">Save</button>');return}
 if(a=='drenok'){dev(x).name=$('dn').value||dev(x).name;closeM();render();return}
 if(a=='dtest'){speak('Hello! This is a test voice.',true);toast('🔔 Test sent to '+dev(x).name);return}
 if(a=='drm'){var d=dev(x);modal('<b>🗑 Remove '+esc(d.name)+'?</b><div class="mute">The phone is unlinked from the family (it keeps no child). Children and progress stay.</div><button class="btn red fx" data-a="drmyes:'+x+'">Yes, remove</button><button class="btn soft" data-a="closem:1">Keep</button>');return}
 if(a=='drmyes'){S.devs=S.devs.filter(function(d){return d.id!=x});closeM();render();return}
 if(a=='pin'){var p=S.pinIn||'';if(x=='⌫')p=p.slice(0,-1);else if(x=='✕'){S.pinIn='';back();return}else p+=x;S.pinIn=p;if(p.length==4){if(p==S.fam.pin){S.pinIn='';S.role='parent';toast('🔓 Parent area');S.scr='home';S.stack=[]}else{S.pinIn='';toast('Wrong PIN')}}render();return}
 if(a=='rvoice'){$('rv').textContent='🎙️ 00:07 voice note saved (demo)';return}
 if(a=='rsend'){toast('✓ Sent to the admin page · WhatsApp opens '+S.fam.wa);dlog('report sent');back();return}
 if(a=='logcopy'){toast('📋 Log copied');return}
 if(a=='wopen'){toast('Opens the app on '+(x=='kids'?'the kids home':'the parent home'));return}
 if(a=='upd'){if(x=='close'){S.upd=null;render();return}S.upd={p:0,n:'🆕 New version: tables sound clearer. It installs by itself - never during a class.'};render();var iv=setInterval(function(){if(!S.upd){clearInterval(iv);return}S.upd.p=Math.min(100,S.upd.p+20);if(S.upd.p==100){clearInterval(iv);VER.kid='v90';VER.app='h29'}render()},700);return}
}
function gohome(){S.stack=[];S.scr='home';render()}
document.addEventListener('keydown',function(e){
 if(!isTV())return;var els=[].slice.call($('app').querySelectorAll('.fx')),i=els.indexOf(document.activeElement);
 if(e.key=='ArrowRight'||e.key=='ArrowDown'){els[(i+1)%els.length].focus();e.preventDefault()}
 else if(e.key=='ArrowLeft'||e.key=='ArrowUp'){els[(i-1+els.length)%els.length].focus();e.preventDefault()}
 else if(e.key=='Enter'&&document.activeElement.hasAttribute('data-a')){document.activeElement.click()}});
window.addEventListener('resize',function(){if(isTV())render()});
render();
</script></body></html>
